<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Alumno - Despierta tu Voz</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background: #f5f2ed; color: #333; min-height: 100vh; }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        .login-section {
            max-width: 380px; margin: 60px auto; padding: 30px;
            background: rgba(255,255,255,0.95); border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); text-align: center;
        }
        .login-section h1 { color: #8e7d6d; margin-bottom: 10px; font-size: 1.6rem; }
        .login-section input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 1rem; outline: none; font-family: inherit; margin-bottom: 10px; }
        .login-section input:focus { border-color: #8e7d6d; }
        .login-error { color: #e74c3c; font-size: 0.85rem; min-height: 1.5em; margin-top: 8px; }

        .dashboard { display: none; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .dash-header h2 { color: #8e7d6d; }
        .logout-btn { background: transparent; border: 1px solid #e74c3c; color: #e74c3c; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
        .logout-btn:hover { background: #e74c3c; color: #fff; }

        .selector-row { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; }
        .selector-row label { font-size: 0.85rem; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
        .selector-row .field { flex: 1; }
        .selector-row input, .selector-row select { width: 100%; padding: 10px 14px; border: 2px solid #eee; border-radius: 12px; font-size: 0.95rem; outline: none; font-family: inherit; }
        .selector-row input:focus, .selector-row select:focus { border-color: #8e7d6d; }

        .main-btn {
            background: #8e7d6d; color: #fff; border: none; padding: 10px 22px;
            border-radius: 12px; font-size: 0.95rem; font-family: inherit; cursor: pointer; white-space: nowrap;
        }
        .main-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(142,125,109,0.3); }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .main-btn.secondary { background: #6c757d; }

        .panel {
            background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 20px;
        }
        .panel h3 { color: #8e7d6d; margin-bottom: 15px; }

        .field-group { margin-bottom: 14px; }
        .field-group label { font-weight: 600; display: block; font-size: 0.85rem; color: #666; margin-bottom: 4px; }
        .field-group .val {
            background: #f9f6f0; padding: 10px 14px; border-radius: 10px;
            font-size: 0.93rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
        }
        .field-group textarea {
            width: 100%; min-height: 100px; padding: 10px 14px;
            border: 2px solid #ddd; border-radius: 10px; font-size: 0.93rem;
            font-family: inherit; outline: none; resize: vertical;
        }
        .field-group textarea:focus { border-color: #8e7d6d; }

        .save-bar { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
        .save-msg { font-size: 0.85rem; color: #27ae60; opacity: 0; transition: opacity 0.3s; }
        .save-msg.show { opacity: 1; }

    /* ===== Dark Mode ===== */
    body.dark-mode { background: #12121e; color: #d4d4dc; }
    body.dark-mode .login-section { background: rgba(28,28,48,0.95); box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    body.dark-mode .login-section input { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
    body.dark-mode .panel { background: rgba(28,28,48,0.95); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    body.dark-mode .panel h3 { color: #a89b8a; }
    body.dark-mode .selector-row label { color: #aaa; }
    body.dark-mode .selector-row input,
    body.dark-mode .selector-row select { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
    body.dark-mode .field-group label { color: #aaa; }
    body.dark-mode .field-group .val { background: #2a2a42; }
    body.dark-mode .field-group textarea { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
    body.dark-mode .main-btn:hover { box-shadow: 0 8px 25px rgba(142,125,109,0.15); }
    body.dark-mode .login-section h1 { color: #a89b8a; }
    body.dark-mode .login-error { color: #ff6b6b; }
    body.dark-mode .dash-header h2 { color: #d4d4dc; }
    body.dark-mode .logout-btn { border-color: #ff6b6b; color: #ff6b6b; }
    body.dark-mode .logout-btn:hover { background: #ff6b6b; color: #fff; }
    body.dark-mode .save-msg { color: #4caf50; }
    @media (prefers-color-scheme: dark) {
        body:not(.light-mode) { background: #12121e; color: #d4d4dc; }
        body:not(.light-mode) .login-section { background: rgba(28,28,48,0.95); }
        body:not(.light-mode) .login-section input { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
        body:not(.light-mode) .panel { background: rgba(28,28,48,0.95); }
        body:not(.light-mode) .panel h3 { color: #a89b8a; }
        body:not(.light-mode) .selector-row label { color: #aaa; }
        body:not(.light-mode) .selector-row input,
        body:not(.light-mode) .selector-row select { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
        body:not(.light-mode) .field-group label { color: #aaa; }
        body:not(.light-mode) .field-group .val { background: #2a2a42; }
        body:not(.light-mode) .field-group textarea { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
        body:not(.light-mode) .login-section h1 { color: #a89b8a; }
        body:not(.light-mode) .login-error { color: #ff6b6b; }
        body:not(.light-mode) .dash-header h2 { color: #d4d4dc; }
        body:not(.light-mode) .logout-btn { border-color: #ff6b6b; color: #ff6b6b; }
        body:not(.light-mode) .logout-btn:hover { background: #ff6b6b; color: #fff; }
        body:not(.light-mode) .save-msg { color: #4caf50; }
    }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="loginSection" class="login-section">
        <h1>Perfil del Alumno</h1>
        <p>Consulta y edita las notas del mentor.</p>
        <input type="email" id="loginEmail" placeholder="Email" value="fernando@despiertatuvoz.com">
        <input type="password" id="loginPassword" placeholder="Contraseña">
        <div class="login-error" id="loginError"></div>
        <button id="loginBtn" class="main-btn" style="width:100%;margin-top:5px;">Entrar</button>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="dash-header">
            <h2>📋 Perfil del Alumno</h2>
            <div style="display:flex;gap:8px;">
                <button id="darkToggle" style="background:transparent;border:1px solid #8e7d6d;color:#8e7d6d;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:1rem;font-family:inherit;" title="Modo oscuro">🌙</button>
                <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
            </div>
        </div>

        <div class="selector-row">
            <div class="field">
                <label for="emailInput">Email del alumno</label>
                <input type="email" id="emailInput" placeholder="email@ejemplo.com" list="alumnoList">
                <datalist id="alumnoList"></datalist>
            </div>
            <button id="seleccionarBtn" class="main-btn">Seleccionar</button>
        </div>

        <div id="perfilPanel" class="panel" style="display:none;">
            <h3 id="perfilNombre">—</h3>

            <div class="field-group"><label>Email</label><div class="val" id="fEmail">—</div></div>
            <div class="field-group"><label>Nivel de Alquimia</label><div class="val" id="fNivel">—</div></div>
            <div class="field-group"><label>Historia Vocal</label><div class="val" id="fHistoria">—</div></div>
            <div class="field-group"><label>Creencias Transmutadas</label><div class="val" id="fCreencias">—</div></div>
            <div class="field-group">
                <label for="fResumen">Último Resumen</label>
                <textarea id="fResumen" placeholder="—" style="min-height:80px;"></textarea>
                <div class="save-bar">
                    <button id="guardarResumenBtn" class="main-btn secondary" disabled>Guardar Resumen</button>
                    <span id="saveResumenMsg" class="save-msg">✅ Guardado</span>
                </div>
            </div>
            <div class="field-group"><label>Trato Preferido</label><div class="val" id="fTrato">—</div></div>
            <div class="field-group"><label>Enfoque (1 Técnico → 10 Emocional)</label><div class="val" id="fFocus">—</div></div>
            <div class="field-group"><label>Personalidad (1 Formal → 10 Cercano)</label><div class="val" id="fPersonalidad">—</div></div>
            <div class="field-group"><label>Longitud (1 Breve → 10 Detallada)</label><div class="val" id="fLength">—</div></div>
            <div class="field-group">
                <label for="fNotas">Notas del Mentor</label>
                <textarea id="fNotas" placeholder="Escribe aquí tus notas..."></textarea>
                <div class="save-bar">
                    <button id="guardarNotasBtn" class="main-btn secondary" disabled>Guardar Notas</button>
                    <span id="saveNotasMsg" class="save-msg">✅ Guardado</span>
                </div>
            </div>
        </div>
    </div>



<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    let sb;
    let perfilActual = null;

    const $ = id => document.getElementById(id);

    async function init() {
        const configRes = await fetch('/api/config');
        const config = await configRes.json();

        const session = localStorage.getItem('sb-session');
        sb = createClient(config.url, config.key, { auth: { persistSession: false } });

        if (session) {
            await sb.auth.setSession(JSON.parse(session));
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                $('loginSection').style.display = 'none';
                $('dashboard').style.display = 'block';
                await cargarAlumnos();
                return;
            }
        }
    }

    $('loginBtn').onclick = async () => {
        const email = $('loginEmail').value.trim();
        const password = $('loginPassword').value.trim();
        if (!email || !password) { $('loginError').textContent = 'Completa ambos campos'; return; }
        $('loginError').textContent = '';
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { $('loginError').textContent = error.message; return; }
        localStorage.setItem('sb-session', JSON.stringify(data.session));
        $('loginSection').style.display = 'none';
        $('dashboard').style.display = 'block';
        await cargarAlumnos();
    };

    $('logoutBtn').onclick = async () => {
        await sb.auth.signOut();
        localStorage.removeItem('sb-session');
        $('dashboard').style.display = 'none';
        $('loginSection').style.display = 'block';
        $('loginPassword').value = '';
    };

    async function cargarAlumnos() {
        const { data } = await sb.from('user_profiles').select('email, nombre').order('nombre');
        const list = $('alumnoList');
        list.innerHTML = (data || []).map(a => `<option value="${a.email}">${a.nombre}</option>`).join('');
    }

    async function cargarPerfil(email) {
        const { data } = await sb.from('user_profiles').select('*').eq('email', email).maybeSingle();
        if (!data) throw new Error('Alumno no encontrado');
        perfilActual = data;
        renderPerfil(data);
    }

    function renderPerfil(p) {
        $('perfilNombre').textContent = `🧑‍🎓 ${p.nombre}`;
        $('fEmail').textContent = p.email || '—';
        $('fNivel').textContent = p.nivel_alquimia ? `${p.nivel_alquimia}/10` : '—';
        $('fHistoria').textContent = p.historia_vocal || '—';
        $('fCreencias').textContent = p.creencias_transmutadas || '—';
        $('fResumen').value = p.ultimo_resumen || '';
        $('guardarResumenBtn').disabled = false;
        $('fTrato').textContent = p.mentor_trato_preferido || '—';
        $('fFocus').textContent = p.mentor_focus != null ? `${Math.round(p.mentor_focus * 10)}/10` : '—';
        $('fPersonalidad').textContent = p.mentor_personality != null ? `${Math.round(p.mentor_personality * 10)}/10` : '—';
        $('fLength').textContent = p.mentor_length != null ? `${Math.round(p.mentor_length * 10)}/10` : '—';
        $('fNotas').value = p.mentor_notes || '';
        $('perfilPanel').style.display = 'block';
        $('guardarNotasBtn').disabled = false;
    }

    $('seleccionarBtn').onclick = async () => {
        const email = $('emailInput').value.trim().toLowerCase();
        if (!email) return;
        try {
            $('seleccionarBtn').disabled = true;
            $('seleccionarBtn').textContent = 'Cargando...';
            $('guardarNotasBtn').disabled = true;
            $('guardarResumenBtn').disabled = true;
            await cargarPerfil(email);
        } catch (e) {
            alert(e.message);
        } finally {
            $('seleccionarBtn').disabled = false;
            $('seleccionarBtn').textContent = 'Seleccionar';
        }
    };

    $('emailInput').onkeydown = e => { if (e.key === 'Enter') $('seleccionarBtn').click(); };

    $('guardarResumenBtn').onclick = async () => {
        if (!perfilActual) return;
        const nuevoResumen = $('fResumen').value;
        const { error } = await sb.from('user_profiles').update({ ultimo_resumen: nuevoResumen }).eq('email', perfilActual.email);
        if (error) { alert('Error al guardar: ' + error.message); return; }
        perfilActual.ultimo_resumen = nuevoResumen;
        const msg = $('saveResumenMsg');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 2000);
    };

    $('guardarNotasBtn').onclick = async () => {
        if (!perfilActual) return;
        const nuevasNotas = $('fNotas').value;
        const { error } = await sb.from('user_profiles').update({ mentor_notes: nuevasNotas }).eq('email', perfilActual.email);
        if (error) { alert('Error al guardar: ' + error.message); return; }
        perfilActual.mentor_notes = nuevasNotas;
        const msg = $('saveNotasMsg');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 2000);
    };

    // ===== Dark Mode =====
    function aplicarModoOscuro(oscuro) {
        document.body.classList.toggle('dark-mode', oscuro);
        $('darkToggle').textContent = oscuro ? '☀️' : '🌙';
        localStorage.setItem('dark-mode', oscuro ? '1' : '0');
    }
    $('darkToggle').onclick = () => aplicarModoOscuro(!document.body.classList.contains('dark-mode'));
    if (localStorage.getItem('dark-mode') === '1' || (localStorage.getItem('dark-mode') === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        aplicarModoOscuro(true);
    }

    init();
</script>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<script>if (localStorage.getItem('dtv_dark_mode') === 'true') document.documentElement.setAttribute('data-theme', 'dark')</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Mensaje Personal - Despierta tu Voz</title>
    <link rel="stylesheet" href="css/style.css?v=7.12">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f2ed; color: #333; margin: 0; padding: 24px; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
        h1 { color: #8e7d6d; margin-top: 0; font-size: 1.8rem; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #555; font-size: 0.95rem; }
        input, textarea, select { width: 100%; padding: 10px 14px; border: 2px solid #e2d9cd; border-radius: 10px; font-size: 1rem; font-family: inherit; box-sizing: border-box; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #8e7d6d; }
        textarea { min-height: 180px; resize: vertical; }
        button.btn-send { background: #8e7d6d; color: #fff; border: none; padding: 12px 28px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
        button.btn-send:hover { background: #7a6a5c; }
        button.btn-send:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert { padding: 12px 16px; border-radius: 10px; margin: 12px 0 18px 0; font-size: 0.9rem; display: none; }
        .alert.error { background: #fdecea; color: #c0392b; border: 1px solid #f5c6c6; }
        .alert.success { background: #e9f7ef; color: #27ae60; border: 1px solid #c3e6cb; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #8e7d6d; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
        .mentor-badge { display: inline-block; background: #d4af37; color: #1f1a16; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-left: 10px; }
        .alumnos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e2d9cd;
            border-radius: 10px;
            padding: 12px;
            background: #fff;
        }
        .alumno-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .alumno-item:hover {
            background: #f9f6f0;
        }
        .alumno-item input[type="checkbox"] {
            margin: 0;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .alumno-nombre {
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .alumno-mail {
            color: #888;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        html[data-theme="dark"] .alumnos-grid {
            background: #2a2420;
            border-color: #443a32;
        }
        html[data-theme="dark"] .alumno-item:hover {
            background: #332d29;
        }
        html[data-theme="dark"] .alumno-nombre { color: #e8e0d6; }
        html[data-theme="dark"] .alumno-mail { color: #bbb; }
        html[data-theme="dark"] .select-all-container label { color: #bbb; }
    </style>
</head>
<body>
    <div class="container">
        <a href="paginas.html" class="back-link">← Volver atrás</a>

        <h1>Enviar Mensaje Personal <span class="mentor-badge">Mentor</span></h1>

        <div class="dark-toggle" style="margin-bottom: 20px; display: flex; justify-content: flex-end; gap: 8px; align-items: center;">
            <label style="font-size: 0.85rem; color: #666; margin: 0; cursor: pointer;">Modo oscuro</label>
            <label class="switch" style="margin: 0; cursor: pointer;">
                <input type="checkbox" id="darkModeToggle">
                <span class="slider"></span>
            </label>
        </div>

        <form id="formMensaje">
            <div class="destinatarios-section" id="destinatariosSection">
                <div class="select-all-container" style="margin-bottom: 12px; display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="selectAllAlumnos">
                    <label for="selectAllAlumnos" style="cursor:pointer;font-weight:600;color:#555; margin:0;">Enviar a todos los alumnos</label>
                </div>
                <div class="alumnos-grid" id="alumnosGrid">
                    <!-- Se poblará dinámicamente con los alumnos -->
                </div>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" placeholder="Título del mensaje" required>
            </div>

            <div class="form-group">
                <label for="contenido">Mensaje</label>
                <textarea id="contenido" placeholder="Escribe tu mensaje personal para el alumno..." required></textarea>
            </div>

            <div class="form-group">
                <label for="archivoAdjunto">Adjuntar archivo (imagen o PDF)</label>
                <input type="file" id="archivoAdjunto" accept="image/jpeg,image/png,image/webp,application/pdf">
                <div id="archivoSeleccionado" style="font-size:0.85rem;color:#888;margin-top:4px;"></div>
            </div>

            <button type="submit" id="btnEnviar" class="btn-send">Enviar Mensaje</button>

            <div id="alertError" class="alert error"></div>
            <div id="alertSuccess" class="alert success"></div>
        </form>

        <p style="font-size: 0.85rem; color: #888; margin-top: 24px;">
            El mensaje aparecerá en el modal de <strong>Mensajes (campana)</strong> de la app del usuario, junto con los avisos de módulos completados.
        </p>
    </div>

    <div id="authOverlay">
        <div class="auth-card">
            <h2>Iniciar sesión</h2>
            <div class="error-msg" id="authErrorMsg"></div>
            <div class="auth-group">
                <label for="authEmail">Correo electrónico</label>
                <input type="email" id="authEmail" placeholder="correo@ejemplo.com">
            </div>
            <div class="auth-group">
                <label for="authPassword">Contraseña</label>
                <div class="password-wrapper" style="display:flex;align-items:center;">
                    <input type="password" id="authPassword" placeholder="••••••••" style="flex:1;">
                    <button type="button" class="toggle-password" data-target="authPassword" style="background:none;border:none;cursor:pointer;padding:0 8px;display:flex;align-items:center;">
                        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="button" id="loginBtn" class="login-btn">Entrar</button>
            <div class="auth-extra">
                ¿No tienes cuenta? <a href="index.html">Ve a la app</a>
            </div>
        </div>
    </div>

    <style>
        #authOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(31, 26, 22, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #authOverlay.visible { display: flex; }
        .auth-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .auth-card h2 { margin-top: 0; color: #8e7d6d; font-size: 1.5rem; text-align: center; }
        .auth-card .error-msg { color: #c0392b; font-size: 0.85rem; margin-bottom: 12px; min-height: 1.2em; }
        .auth-card .auth-group { margin-bottom: 14px; }
        .auth-card label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 0.9rem; }
        .auth-card input { width: 100%; padding: 10px 14px; border: 2px solid #e2d9cd; border-radius: 10px; font-size: 1rem; box-sizing: border-box; }
        .auth-card input:focus { outline: none; border-color: #8e7d6d; }
        .auth-card button.login-btn { background: #8e7d6d; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
        .auth-card button.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-card .auth-extra { margin-top: 16px; text-align: center; font-size: 0.85rem; color: #666; }
        .auth-card .auth-extra a { color: #8e7d6d; text-decoration: none; }
        .auth-card .auth-extra a:hover { text-decoration: underline; }

        /* Switch toggle modo oscuro */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ccc;
            transition: 0.3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background: #fff;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider { background: #8e7d6d; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Dark mode styles para esta página */
        html[data-theme="dark"] body { background: #1f1a16; color: #e8e0d6; }
        html[data-theme="dark"] .container { background: #2a2420; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        html[data-theme="dark"] h1 { color: #d4af37; }
        html[data-theme="dark"] label { color: #bbb; }
        html[data-theme="dark"] input, html[data-theme="dark"] textarea, html[data-theme="dark"] select {
            background: #1a1511; border-color: #443a32; color: #e8e0d6;
        }
        html[data-theme="dark"] input:focus, html[data-theme="dark"] textarea:focus, html[data-theme="dark"] select:focus {
            border-color: #d4af37;
        }
        html[data-theme="dark"] .alert.error { background: #3a2424; color: #f5a6a6; border-color: #5c3333; }
        html[data-theme="dark"] .alert.success { background: #243a2a; color: #a6f5a6; border-color: #335c33; }
        html[data-theme="dark"] .back-link { color: #d4af37; }
        html[data-theme="dark"] .mentor-badge { background: #d4af37; color: #1f1a16; }
        html[data-theme="dark"] .destinatario-hint { color: #999; }
        html[data-theme="dark"] button.btn-add { color: #d4af37; border-color: #d4af37; }
        html[data-theme="dark"] button.btn-add:hover { background: #2a2420; }
        html[data-theme="dark"] .auth-card { background: #2a2420; color: #e8e0d6; }
        html[data-theme="dark"] .auth-card h2 { color: #d4af37; }
        html[data-theme="dark"] .auth-card .error-msg { color: #f5a6a6; }
        html[data-theme="dark"] .auth-card label { color: #bbb; }
        html[data-theme="dark"] .auth-card input { background: #1a1511; border-color: #443a32; color: #e8e0d6; }
        html[data-theme="dark"] .auth-card input:focus { border-color: #d4af37; }
        html[data-theme="dark"] .auth-card button.login-btn { background: #8e7d6d; }
        html[data-theme="dark"] .auth-card .auth-extra { color: #999; }
        html[data-theme="dark"] .auth-card .auth-extra a { color: #d4af37; }
        html[data-theme="dark"] .switch .slider { background: #443a32; }
        html[data-theme="dark"] .switch input:checked + .slider { background: #d4af37; }
    </style>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        let sb;
        const $ = id => document.getElementById(id);
        const form = $('formMensaje');
        const btnEnviar = $('btnEnviar');
        const alertError = $('alertError');
        const alertSuccess = $('alertSuccess');
        const authOverlay = $('authOverlay');
        const authError = $('authErrorMsg');
        const loginBtn = $('loginBtn');
        const authEmail = $('authEmail');
        const authPassword = $('authPassword');
        const archivoInput = $('archivoAdjunto');
        const archivoSeleccionado = $('archivoSeleccionado');
        let archivoBase64 = null;
        let archivoNombre = null;
        let archivoTipo = null;

        archivoInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            archivoNombre = file.name;
            archivoTipo = file.type;
            archivoSeleccionado.textContent = `📎 ${archivoNombre} (${Math.round(file.size / 1024)} KB)`;
            archivoBase64 = await leerArchivoComoBase64(file);
        };

        function leerArchivoComoBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); // solo los datos base64 sin el prefijo data:...
                reader.onerror = reject;
            });
        }

        function showAlert(el, text) {
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        async function doLogin() {
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();
            if (!email || !password) return authError.textContent = 'Completa email y contraseña.';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Entrando...';
            authError.textContent = '';
            try {
                const { error } = await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;
                location.reload();
            } catch (e) {
                authError.textContent = e.message || 'Credenciales incorrectas.';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Entrar';
            }
        }

        async function init() {
            try {
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                sb = createClient(config.url, config.key, { auth: { persistSession: false } });

                const session = localStorage.getItem('sb-session');
                if (session) {
                    await sb.auth.setSession(JSON.parse(session));
                }

                const { data: { user }, error } = await sb.auth.getUser();
                if (error || !user) {
                    $('formMensaje').style.display = 'none';
                    authOverlay.classList.add('visible');
                    return;
                }

                // Verificar que es mentor (por email o rol)
                const email = String(user.email || '').toLowerCase();
                const mentorEmails = ['fernando@despiertatuvoz.com'];
                const role = user.app_metadata?.role || user.user_metadata?.role;
                const esMentor = mentorEmails.includes(email) || role === 'mentor' || role === 'admin';

                if (!esMentor) {
                    $('formMensaje').style.display = 'none';
                    showAlert(alertError, 'Solo el mentor puede enviar mensajes personales.');
                    return;
                }

                console.log('✅ Mentor autenticado:', user.email);

                // Cargar lista de alumnos para el select
                await cargarAlumnos();
            } catch (e) {
                console.error('Error init:', e);
                showAlert(alertError, 'Error inicializando la sesión. Recarga la página.');
            }
        }

        async function cargarAlumnos() {
            const grid = $('alumnosGrid');
            if (!grid) return;

            try {
                const { data: profiles, error } = await sb
                    .from('user_profiles')
                    .select('user_id, email, nombre')
                    .not('email', 'ilike', '%@test.com%')
                    .order('email', { ascending: true });

                if (error) throw error;

                // Filtro adicional por si el operador no funciona en la DB
                const perfilesFiltrados = (profiles || []).filter(
                    p => !p.email.toLowerCase().includes('@test.com')
                );

                grid.innerHTML = '';
                perfilesFiltrados.forEach(p => {
                    const userId = p.user_id;
                    const nombre = p.nombre || p.email.split('@')[0];
                    const item = document.createElement('label');
                    item.className = 'alumno-item';
                    item.innerHTML = `
                        <input type="checkbox" class="alumno-checkbox" value="${userId}">
                        <span class="alumno-nombre">${nombre}</span><br>
                        <span class="alumno-mail">${p.email}</span>
                    `;
                    grid.appendChild(item);
                });
            } catch (e) {
                console.error('Error cargando alumnos:', e);
                showAlert(alertError, 'No se pudo cargar la lista de alumnos.');
            }
        }

        async function obtenerToken() {
            // Intento 1: sesión de Supabase restaurada
            try {
                const session = await sb.auth.getSession();
                if (session?.data?.session?.access_token) {
                    return session.data.session.access_token;
                }
            } catch (_) {}

            // Intento 2: leer directamente de localStorage sb-session
            try {
                const raw = localStorage.getItem('sb-session');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed?.access_token) return parsed.access_token;
                    if (parsed?.session?.access_token) return parsed.session.access_token;
                }
            } catch (_) {}

            return null;
        }

        // Checkbox "Enviar a todos"
        const selectAllBtn = $('selectAllAlumnos');
        selectAllBtn.onchange = () => {
            const checkboxes = document.querySelectorAll('.alumno-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAllBtn.checked);
        };

        // Si se desmarca algún alumno individual, desmarcar "Enviar a todos"
        document.addEventListener('change', (e) => {
            if (e.target.classList.contains('alumno-checkbox')) {
                const all = document.querySelectorAll('.alumno-checkbox');
                const checked = document.querySelectorAll('.alumno-checkbox:checked');
                selectAllBtn.checked = all.length === checked.length;
            }
        });

        form.onsubmit = async (e) => {
            e.preventDefault();
            alertError.style.display = 'none';
            alertSuccess.style.display = 'none';

            const checkboxes = document.querySelectorAll('.alumno-checkbox:checked');
            const destinatariosIds = Array.from(checkboxes)
                .map(cb => cb.value)
                .filter(Boolean);

            if (!destinatariosIds.length) {
                showAlert(alertError, 'Selecciona al menos un alumno.');
                return;
            }

            const asunto = $('asunto').value.trim();
            const contenido = $('contenido').value.trim();

            if (!destinatariosIds.length || !asunto || !contenido) {
                showAlert(alertError, 'Selecciona al menos un alumno y completa todos los campos.');
                return;
            }

            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Enviando...';

            try {
                const token = await obtenerToken();

                if (!token) {
                    showAlert(alertError, 'No se pudo obtener el token de sesión. Vuelve a iniciar sesión.');
                    btnEnviar.disabled = false;
                    btnEnviar.textContent = 'Enviar Mensaje';
                    return;
                }

                // Enviar un mensaje por cada destinatario seleccionado
                const resultados = await Promise.all(destinatariosIds.map(id =>
                    fetch('/api/chat?action=enviar-mensaje', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            destinatario_id: id,
                            asunto,
                            contenido,
                            archivo_nombre: archivoNombre || null,
                            archivo_tipo: archivoTipo || null,
                            archivo_datos: archivoBase64 || null
                        })
                    })
                ));

                const fallos = resultados.filter(r => !r.ok);

                if (fallos.length) {
                    const errJson = await fallos[0].json().catch(() => ({}));
                    showAlert(alertError, errJson.error || 'Error al enviar algunos mensajes.');
                    btnEnviar.disabled = false;
                    btnEnviar.textContent = 'Enviar Mensaje';
                    return;
                }

                showAlert(alertSuccess, `✅ Mensaje enviado a ${destinatariosIds.length} usuario${destinatariosIds.length > 1 ? 's' : ''}. Lo verán en su campana de Mensajes.`);
                form.reset();
                archivoInput.value = '';
                archivoSeleccionado.textContent = '';
                archivoBase64 = null;
                archivoNombre = null;
                archivoTipo = null;
                // Desmarcar todos los checkboxes de alumnos
                document.querySelectorAll('.alumno-checkbox').forEach(cb => cb.checked = false);
                selectAllBtn.checked = false;
            } catch (err) {
                console.error(err);
                showAlert(alertError, 'Error de conexión al enviar el mensaje.');
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Enviar Mensaje';
            }
        };

        init();

        loginBtn.onclick = doLogin;

        authEmail.onkeypress = (e) => { if (e.key === 'Enter') authPassword.focus(); };
        authPassword.onkeypress = (e) => { if (e.key === 'Enter') doLogin(); };

        authOverlay.onclick = (e) => {
            if (e.target === authOverlay) authOverlay.classList.remove('visible');
        };

        // ── Modo oscuro ───────────────────────────────────────────────────
        const darkToggle = $('darkModeToggle');
        if (localStorage.getItem('dtv_dark_mode') === 'true') {
            darkToggle.checked = true;
        }
        darkToggle.onchange = () => {
            if (darkToggle.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('dtv_dark_mode', 'true');
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('dtv_dark_mode', 'false');
            }
        };

        // ── Ojo para mostrar/ocultar contraseña ───────────────────────────
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.onclick = () => {
                const input = document.getElementById(btn.dataset.target);
                const icon = btn.querySelector('.eye-icon path:first-child');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.setAttribute('d', 'M1 7.984A12.044 12.044 0 0 1 3.614 7.492c.09-.138.208-.265.34-.377C5.08 6.393 7.544 6 12 6c4.456 0 6.92.393 8.046 1.117.132.112.25.239.34.377C20.386 7.492 22.984 7.984 23 12c0 4.016-2.614 4.508-3.614 4.508-.09.138-.208.265-.34.377C18.92 17.607 16.456 18 12 18c-4.456 0-6.92-.393-8.046-1.117-.132-.112-.25-.239-.34-.377C2.614 16.508 0 16.016 0 12z');
                    icon.setAttribute('stroke', 'currentColor');
                } else {
                    input.type = 'password';
                    icon.setAttribute('d', 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z');
                    icon.setAttribute('stroke', 'currentColor');
                }
                input.focus();
            };
        });
    </script>
</body>
</html>

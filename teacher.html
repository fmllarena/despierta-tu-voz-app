<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Teacher - Despierta tu Voz</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background: #f0f5fa; color: #333; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .login-section { max-width: 380px; margin: 60px auto; padding: 30px; background: rgba(255,255,255,0.95); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); text-align: center; }
        .login-section h1 { color: #2c6b9e; margin-bottom: 10px; font-size: 1.6rem; }
        .login-section input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 1rem; outline: none; font-family: inherit; margin-bottom: 10px; }
        .login-section input:focus { border-color: #2c6b9e; }
        .login-error { color: #e74c3c; font-size: 0.85rem; min-height: 1.5em; margin-top: 8px; }
        .dashboard { display: none; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .dash-header h2 { color: #2c6b9e; }
        .logout-btn { background: transparent; border: 1px solid #e74c3c; color: #e74c3c; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
        .logout-btn:hover { background: #e74c3c; color: #fff; }
        .chat-header { padding: 10px 16px; background: #e8f0fe; border-bottom: 1px solid #d0ddea; }
        .chat-header h3 { color: #2c6b9e; font-size: 0.95rem; margin-bottom: 4px; }
        .chat-header p { font-size: 0.8rem; color: #888; margin-top: 4px; }
        .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.6; word-break: break-word; }
        .msg strong { font-weight: 600; }
        .msg em { font-style: italic; }
        .msg.user { align-self: flex-end; background: #2c6b9e; color: #fff; border-bottom-right-radius: 4px; }
        .msg.ia { align-self: flex-start; background: #f0f5fa; color: #333; border-bottom-left-radius: 4px; }
.msg.ia .tts-msg-btn {
            background: transparent; border: 1px solid #2c6b9e; color: #2c6b9e;
            border-radius: 8px; cursor: pointer; font-size: 0.85rem; padding: 2px 8px;
            margin-top: 6px; font-family: inherit; line-height: 1.4;
        }
        .msg.ia .tts-msg-btn:hover { background: #2c6b9e; color: #fff; }
        .msg.ia .tts-msg-btn.playing { background: #2c6b9e; color: #fff; }
        .msg.ia .tts-msg-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-input-area { display: flex; gap: 10px; padding: 15px 20px; border-top: 1px solid #d0ddea; background: #f8fafc; }
        .chat-input-area textarea { flex: 1; padding: 12px; border: 2px solid #d0ddea; border-radius: 12px; font-size: 0.95rem; outline: none; font-family: inherit; resize: none; height: 50px; }
        .chat-input-area textarea:focus { border-color: #2c6b9e; }
        .chat-input-area .send-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; font-size: 1.5rem; cursor: pointer; flex-shrink: 0; color: #2c6b9e; }
        .chat-empty { text-align: center; padding: 40px; color: #aaa; font-size: 0.9rem; }
        .loading-dots { align-self: flex-start; padding: 12px 16px; border-radius: 15px; background: #f0f5fa; color: #888; font-size: 1.2rem; border-bottom-left-radius: 4px; }

        body.dark-mode { background: #0d1b2a; color: #d4d4dc; }
        body.dark-mode .login-section { background: rgba(20,35,55,0.95); }
        body.dark-mode .login-section input { background: #1a2d45; border-color: #2a4565; color: #d4d4dc; }
        body.dark-mode .chat-box { flex: 1; background: rgba(20,35,55,0.95); }
        body.dark-mode .chat-header { background: #15273d; border-color: #2a4565; }
        body.dark-mode .chat-header h3 { color: #6ba4d6; }
        body.dark-mode .chat-body { background: #0d1b2a; }
        body.dark-mode .msg.ia { background: #1a2d45; color: #d4d4dc; }
        body.dark-mode .msg.user { background: #2c6b9e; }
        body.dark-mode .msg.ia .tts-msg-btn { border-color: #6ba4d6; color: #6ba4d6; }
        body.dark-mode .msg.ia .tts-msg-btn:hover { background: #6ba4d6; color: #0d1b2a; }
        body.dark-mode .msg.ia .tts-msg-btn.playing { background: #6ba4d6; color: #0d1b2a; }
        .tips-summary { background: #e8f4e8; border: 1px solid #4a8; border-radius: 12px; padding: 12px 16px; margin: 8px 0; font-size: 0.9rem; }
        .tips-summary ul { margin: 6px 0 0 0; padding-left: 20px; }
        .tips-summary li { margin: 4px 0; }
        .tips-summary small { color: #666; }
        body.dark-mode .tips-summary { background: #1a3a2a; border-color: #4a8; }
        body.dark-mode .tips-summary small { color: #aaa; }
        body.dark-mode #addTipBtn { border-color: #4a8 !important; color: #4a8 !important; }
        body.dark-mode #listTipsBtn { border-color: #4a8 !important; color: #4a8 !important; }
        body.dark-mode .chat-input-area { background: #15273d; border-color: #2a4565; }
        body.dark-mode .chat-input-area textarea { background: #1a2d45; border-color: #2a4565; color: #d4d4dc; }
        body.dark-mode .loading-dots { background: #1a2d45; color: #888; }
        body.dark-mode .dash-header h2 { color: #d4d4dc; }
        body.dark-mode .logout-btn { border-color: #ff6b6b; color: #ff6b6b; }
        body.dark-mode .logout-btn:hover { background: #ff6b6b; color: #fff; }
        body.dark-mode .login-section h1 { color: #6ba4d6; }
        body.dark-mode .login-error { color: #ff6b6b; }

        .main-layout { display: flex; gap: 16px; align-items: flex-start; }
        .chat-box { flex: 1; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; height: 70vh; min-height: 400px; }
        .tips-panel { width: 330px; height: 420px; background: rgba(255,255,255,0.95); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: none; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        .tips-panel.open { display: flex; }
        .tips-panel-header { padding: 10px 14px; background: #e8f0fe; border-bottom: 1px solid #d0ddea; display: flex; justify-content: space-between; align-items: center; }
        .tips-panel-header h3 { font-size: 0.9rem; color: #2c6b9e; }
        .tips-panel-header button { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: #888; padding: 0 4px; }
        .tips-panel-body { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 0.85rem; }
        .tips-panel-body .tip-item { padding: 6px 0; border-bottom: 1px solid #eee; }
        .tips-panel-body .tip-item:last-child { border-bottom: none; }
        .tips-panel-body .tip-day { color: #888; font-size: 0.75rem; margin-bottom: 2px; }
        .tips-panel-body .tip-text { line-height: 1.5; }
        body.dark-mode .tips-panel { background: rgba(20,35,55,0.95); }
        body.dark-mode .tips-panel-header { background: #15273d; border-color: #2a4565; }
        body.dark-mode .tips-panel-header h3 { color: #6ba4d6; }
        body.dark-mode .tips-panel-body .tip-item { border-color: #2a4565; }
        body.dark-mode .tips-panel-body .tip-day { color: #888; }
        body.dark-mode .tips-panel-header button { color: #aaa; }

        .topic-sug { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        .topic-sug button { background: #e8f0fe; border: 1px solid #d0ddea; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.7rem; color: #2c6b9e; }
        .topic-sug button:hover { background: #2c6b9e; color: #fff; border-color: #2c6b9e; }
        body.dark-mode .topic-sug button { background: #1a2d45; border-color: #2a4565; color: #6ba4d6; }
        body.dark-mode .topic-sug button:hover { background: #2c6b9e; color: #fff; border-color: #2c6b9e; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 14px; padding: 18px; width: 90%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; cursor: grab; user-select: none; -webkit-user-select: none; }
        .modal-header:active { cursor: grabbing; }
        .modal-header h3 { font-size: 1rem; color: #2c6b9e; margin: 0; }
        .modal-close { background: transparent; border: none; font-size: 1.4rem; cursor: pointer; color: #888; }
        .modal-textarea { width: 100%; padding: 10px; border: 2px solid #d0ddea; border-radius: 10px; font-size: 0.95rem; font-family: inherit; outline: none; resize: vertical; box-sizing: border-box; }
        .modal-textarea:focus { border-color: #2c6b9e; }
        .modal-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
        .modal-btn { padding: 8px 14px; border: 1px solid #ccc; border-radius: 8px; background: #f0f5fa; color: #333; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
        .modal-btn.primary { background: #2c6b9e; color: #fff; border-color: #2c6b9e; }
        .modal-btn.primary:hover { background: #245a86; }
        .arrow-btn { font-size: 1.1rem; background: #e8f0fe; border-color: #d0ddea; color: #2c6b9e; }
        body.dark-mode .modal-box { background: #15273d; }
        body.dark-mode .modal-header h3 { color: #6ba4d6; }
        body.dark-mode .modal-textarea { background: #1a2d45; border-color: #2a4565; color: #d4d4dc; }
        body.dark-mode .modal-btn { background: #1a2d45; border-color: #2a4565; color: #d4d4dc; }
        body.dark-mode .arrow-btn { background: #1a2d45; border-color: #2a4565; color: #6ba4d6; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="loginSection" class="login-section">
        <h1>ðŸ‡ºðŸ‡¸ English Teacher</h1>
        <p>Practice your American English conversation skills.</p>
        <input type="email" id="loginEmail" placeholder="Email" value="fernando@despiertatuvoz.com">
        <input type="password" id="loginPassword" placeholder="ContraseÃ±a">
        <div class="login-error" id="loginError"></div>
        <button id="loginBtn" class="main-btn" style="width:100%;margin-top:5px;background:#2c6b9e;">Entrar</button>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="dash-header">
            <h2>ðŸ‡ºðŸ‡¸ English Teacher</h2>
            <div style="display:flex;gap:8px;">
                <button id="reviewBtn" style="background:#2c6b9e;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem;font-family:inherit;">ðŸ“ Daily Review</button>
                <button id="listTipsBtn" style="background:transparent;border:1px solid #4a8;color:#4a8;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem;font-family:inherit;">ðŸ“‹ Listado de tips</button>
                <button id="addTipBtn" style="background:transparent;border:1px solid #4a8;color:#4a8;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem;font-family:inherit;">âœï¸ +Tip</button>
                <button id="darkToggle" style="background:transparent;border:1px solid #2c6b9e;color:#2c6b9e;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:1rem;font-family:inherit;" title="Modo oscuro">ðŸŒ™</button>
                <button id="clearChatBtn" style="background:transparent;border:1px solid #e74c3c;color:#e74c3c;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.85rem;font-family:inherit;">ðŸ—‘ Borrar</button>
                <button id="logoutBtn" class="logout-btn">Cerrar SesiÃ³n</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="chat-box">
                <div class="chat-header">
                    <h3>ðŸ§‘â€ðŸ« Your English Teacher â€” B1 Conversational</h3>
                    <div class="topic-sug">
                        <button data-t="Introduce yourself">Introduce yourself</button>
                        <button data-t="Talk about your weekend">Talk about your weekend</button>
                        <button data-t="Order food at a restaurant">Order food at a restaurant</button>
                        <button data-t="Describe your job">Describe your job</button>
                        <button data-t="Make a phone appointment">Make a phone appointment</button>
                    </div>
                </div>
                <div id="chatBody" class="chat-body">
                    <div class="chat-empty">ðŸ’¬ Write something in English to start...</div>
                </div>
                <div class="chat-input-area">
                    <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;white-space:nowrap;cursor:pointer;color:#555;">
                        <input type="checkbox" id="pureChat" style="cursor:pointer;"> Solo conversar
                    </label>
                    <textarea id="msgInput" placeholder="Write in English..." rows="1"></textarea>
                    <button id="sendBtn" class="send-btn">âž¤</button>
                </div>
            </div>

            <div id="tipsPanel" class="tips-panel">
                <div class="tips-panel-header">
                    <h3>ðŸ“‹ Tips acumulados</h3>
                    <button id="closeTipsPanel">&times;</button>
                </div>
                <div id="tipsPanelBody" class="tips-panel-body">
                    <p style="color:#888;text-align:center;padding:20px;">Haz clic en "Listado de tips" para verlos.</p>
                </div>
            </div>

            <div id="addTipModal" class="modal-overlay" style="display:none;">
                <div class="modal-box">
                    <div class="modal-header">
                        <h3>âœï¸ Nuevo tip</h3>
                        <button id="closeAddTipModal" class="modal-close">&times;</button>
                    </div>
                    <textarea id="tipInput" class="modal-textarea" rows="3" spellcheck="false"></textarea>
                    <div class="modal-actions">
                        <button id="tipArrowBtn" class="modal-btn arrow-btn">â†’</button>
                        <span style="flex:1;"></span>
                        <button id="saveTipBtn" class="modal-btn primary">Guardar</button>
                        <button id="cancelAddTipBtn" class="modal-btn">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    let sb;
    let history = [];
    let esperando = false;
    let userId = null;
    let pendingIntent = 'teacher';

    const $ = id => document.getElementById(id);
    const chatBody = $('chatBody');

    async function init() {
        const configRes = await fetch('/api/config');
        const config = await configRes.json();
        sb = createClient(config.url, config.key, { auth: { persistSession: false } });

        const session = localStorage.getItem('sb-session');
        if (session) {
            await sb.auth.setSession(JSON.parse(session));
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                userId = user.id;
                $('loginSection').style.display = 'none';
                $('dashboard').style.display = 'block';
                return;
            }
        }
    }

    $('loginBtn').onclick = async () => {
        const email = $('loginEmail').value.trim();
        const password = $('loginPassword').value.trim();
        if (!email || !password) { $('loginError').textContent = 'Completa ambos campos'; return; }
        $('loginError').textContent = '';
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { $('loginError').textContent = error.message; return; }
        localStorage.setItem('sb-session', JSON.stringify(data.session));
        userId = data.user.id;
        $('loginSection').style.display = 'none';
        $('dashboard').style.display = 'block';
    };

    $('logoutBtn').onclick = async () => {
        await sb.auth.signOut();
        localStorage.removeItem('sb-session');
        history = [];
        userId = null;
        $('dashboard').style.display = 'none';
        $('loginSection').style.display = 'block';
        $('loginPassword').value = '';
    };

    function aplicarModoOscuro(oscuro) {
        document.body.classList.toggle('dark-mode', oscuro);
        $('darkToggle').textContent = oscuro ? 'â˜€ï¸' : 'ðŸŒ™';
        localStorage.setItem('dark-mode', oscuro ? '1' : '0');
    }
    $('darkToggle').onclick = () => aplicarModoOscuro(!document.body.classList.contains('dark-mode'));
    if (localStorage.getItem('dark-mode') === '1' || (localStorage.getItem('dark-mode') === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        aplicarModoOscuro(true);
    }

    $('clearChatBtn').onclick = () => { history = []; chatBody.innerHTML = '<div class="chat-empty">ðŸ’¬ Conversation cleared.</div>'; };

    let skipDisplay = false;

    $('reviewBtn').onclick = () => {
        if (pendingIntent === 'teacher_review') {
            pendingIntent = 'teacher';
            history = [];
            chatBody.innerHTML = '<div class="chat-empty">ðŸ’¬ Back to conversation mode.</div>';
            $('reviewBtn').style.background = '#2c6b9e';
            $('reviewBtn').textContent = 'ðŸ“ Daily Review';
            return;
        }
        pendingIntent = 'teacher_review';
        history = [];
        chatBody.innerHTML = '<div class="chat-empty">ðŸ“ Starting daily review...</div>';
        $('reviewBtn').style.background = '#e67e22';
        $('reviewBtn').textContent = 'ðŸ”„ Back to chat';
        skipDisplay = true;
        $('msgInput').value = 'Start the review';
        enviar();
    };

    $('addTipBtn').onclick = () => {
        const input = $('tipInput');
        input.value = 'ðŸŽ¯ Tip: ';
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        $('addTipModal').style.display = 'flex';
    };

    const closeAddTipModal = () => { $('addTipModal').style.display = 'none'; };
    $('closeAddTipModal').onclick = closeAddTipModal;
    $('cancelAddTipBtn').onclick = closeAddTipModal;
    $('addTipModal').onclick = (e) => { if (e.target === $('addTipModal')) closeAddTipModal(); };

    // Modal arrastrable por la cabecera
    const tipModalBox = $('addTipModal').querySelector('.modal-box');
    const tipModalHeader = tipModalBox.querySelector('.modal-header');
    let tipDragging = false, tipStartX = 0, tipStartY = 0, tipLeft = 0, tipTop = 0;

    tipModalHeader.addEventListener('mousedown', (e) => {
        if (e.target.closest('button')) return;
        tipDragging = true;
        const rect = tipModalBox.getBoundingClientRect();
        tipStartX = e.clientX; tipStartY = e.clientY;
        tipLeft = rect.left; tipTop = rect.top;
        tipModalBox.style.transform = 'none';
        tipModalBox.style.left = tipLeft + 'px';
        tipModalBox.style.top = tipTop + 'px';
        e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
        if (!tipDragging) return;
        tipModalBox.style.left = (tipLeft + e.clientX - tipStartX) + 'px';
        tipModalBox.style.top = (tipTop + e.clientY - tipStartY) + 'px';
    });

    document.addEventListener('mouseup', () => { tipDragging = false; });

    $('tipArrowBtn').onclick = () => {
        const input = $('tipInput');
        const start = input.selectionStart || 0;
        const end = input.selectionEnd || 0;
        const prefix = input.value.slice(0, start);
        const suffix = input.value.slice(end);
        input.value = prefix + 'â†’' + suffix;
        input.focus();
        input.setSelectionRange(start + 1, start + 1);
    };

    $('saveTipBtn').onclick = async () => {
        let tip = $('tipInput').value.trim();
        if (!tip) return;
        tip = tip.replace(/^(ðŸŽ¯\s*)?Tip:\s*/i, '');
        tip = 'ðŸŽ¯ Tip: ' + tip;
        if (!tip.includes('â†’')) {
            alert('AÃ±ade la flecha â†’ para separar la frase original de la correcciÃ³n.');
            return;
        }
        closeAddTipModal();
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ intent: 'add_teacher_tip', userId, tip })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.details || data.error);
            agregarMensaje(`âœ… Tip guardado: ${tip}`, 'ia');
        } catch (e) {
            agregarMensaje('âš ï¸ Error al guardar tip: ' + e.message, 'ia');
        }
    };

    $('listTipsBtn').onclick = async () => {
        const panel = $('tipsPanel');
        const body = $('tipsPanelBody');
        panel.classList.add('open');
        body.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">Cargando...</p>';
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ intent: 'get_teacher_tips', userId })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.details || data.error);
            if (!data.tips || data.tips.length === 0) {
                body.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">ðŸ“­ No hay tips guardados aÃºn.</p>';
                return;
            }
            let html = '';
            data.tips.forEach(t => {
                html += `<div class="tip-item"><div class="tip-day">${t.day}</div><div class="tip-text">${t.content.replace(/\n/g, '<br>')}</div></div>`;
            });
            body.innerHTML = html;
        } catch (e) {
            body.innerHTML = `<p style="color:#e74c3c;text-align:center;padding:20px;">âš ï¸ Error: ${e.message}</p>`;
        }
    };

    $('closeTipsPanel').onclick = () => { $('tipsPanel').classList.remove('open'); };

    document.querySelectorAll('.topic-sug button').forEach(btn => {
        btn.onclick = () => { $('msgInput').value = btn.dataset.t; $('sendBtn').click(); };
    });

    function agregarMensaje(texto, rol) {
        if (rol === 'user' && skipDisplay) { skipDisplay = false; return; }
        const div = document.createElement('div');
        div.className = `msg ${rol}`;
        div.innerHTML = marked.parse(texto);
        if (rol === 'ia') {
            const tts = document.createElement('button');
            tts.className = 'tts-msg-btn';
            tts.textContent = 'ðŸ”Š Escuchar';
            tts.dataset.text = texto;
            tts.onclick = () => leerMensaje(tts);
            div.appendChild(tts);
        }
        const empty = chatBody.querySelector('.chat-empty');
        if (empty) empty.remove();
        chatBody.appendChild(div);
        if (rol === 'user') {
            chatBody.scrollTop = chatBody.scrollHeight;
        } else {
            div.scrollIntoView({ block: 'start' });
        }
    }

    // ===== Lector de texto (Google TTS) =====
    let audioActual = null;
    let botonActual = null;

    function resetBotonUI(btn) {
        if (!btn) return;
        btn.textContent = 'ðŸ”Š Escuchar';
        btn.classList.remove('playing');
        btn.disabled = false;
    }

    function pararLectura() {
        if (audioActual) audioActual.pause();
        resetBotonUI(botonActual);
        audioActual = null;
        botonActual = null;
    }

    async function leerMensaje(btn) {
        const texto = (btn.dataset.text || '').replace(/[#*_`>]/g, ' ').replace(/\s+/g, ' ').trim();
        if (!texto) return;

        // Mismo botÃ³n ya cargado â†’ Detener/Continuar (reanuda donde se quedÃ³)
        if (btn._audio) {
            if (!btn._audio.paused) {
                btn._audio.pause();
                btn.textContent = 'â–¶ Continuar';
                btn.classList.remove('playing');
                return;
            }
            audioActual = btn._audio;
            botonActual = btn;
            btn.classList.add('playing');
            btn.textContent = 'â¹ Detener';
            await btn._audio.play();
            return;
        }

        // Si suena otro mensaje, lo paramos
        if (audioActual && !audioActual.paused) {
            audioActual.pause();
            resetBotonUI(botonActual);
        }

        btn.classList.add('playing');
        btn.textContent = 'â¹ Detener';
        btn.disabled = true;

        try {
            const pureChat = document.getElementById('pureChat').checked;
            const res = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: texto,
                    languageCode: 'en-US',
                    speakingRate: 0.95,
                    voiceName: pureChat ? 'en-US-Standard-C' : 'en-US-Standard-B',
                    gender: pureChat ? 'FEMALE' : 'MALE'
                })
            });
            const data = await res.json();
            if (!res.ok || !data.audioContent) throw new Error(data.error || 'Error al generar audio');

            const audio = new Audio('data:audio/mp3;base64,' + data.audioContent);
            btn._audio = audio;
            audioActual = audio;
            botonActual = btn;
            btn.disabled = false;
            audio.onended = () => {
                btn._audio = null;
                pararLectura();
            };
            audio.onerror = () => {
                btn._audio = null;
                pararLectura();
                agregarMensaje('âš ï¸ No se pudo reproducir el audio.', 'ia');
            };
            await audio.play();
        } catch (e) {
            pararLectura();
            resetBotonUI(btn);
            agregarMensaje('âš ï¸ Error de audio: ' + e.message, 'ia');
        }
    }

    function mostrarLoading() {
        const div = document.createElement('div');
        div.className = 'loading-dots';
        div.id = 'loadingDots';
        div.textContent = 'âœ¦ âœ¦ âœ¦';
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function quitarLoading() {
        const el = document.getElementById('loadingDots');
        if (el) el.remove();
    }

    async function enviar() {
        const texto = $('msgInput').value.trim();
        if (!texto || esperando || !userId) return;
        $('msgInput').value = '';
        esperando = true;

        agregarMensaje(texto, 'user');
        history.push({ role: 'user', parts: [{ text: texto }] });
        mostrarLoading();

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    intent: pendingIntent,
                    message: texto,
                    history: history.slice(-50),
                    userId,
                    pureChat: document.getElementById('pureChat').checked
                })
            });
            const data = await res.json();
            quitarLoading();
            if (data.error) throw new Error(data.details || data.error);

            const respuesta = data.text || '';
            agregarMensaje(respuesta, 'ia');
            history.push({ role: 'model', parts: [{ text: respuesta }] });
        } catch (e) {
            quitarLoading();
            agregarMensaje('âš ï¸ Error: ' + e.message, 'ia');
        } finally {
            esperando = false;
        }
    }

    $('sendBtn').onclick = enviar;
    $('msgInput').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } };

    init();
</script>
</body>
</html>

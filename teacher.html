<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Teacher - Despierta tu Voz</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background: #f0f5fa; color: #333; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .login-section { max-width: 380px; margin: 60px auto; padding: 30px; background: rgba(255,255,255,0.95); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); text-align: center; }
        .login-section h1 { color: #2c6b9e; margin-bottom: 10px; font-size: 1.6rem; }
        .login-section input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 1rem; outline: none; font-family: inherit; margin-bottom: 10px; }
        .login-section input:focus { border-color: #2c6b9e; }
        .login-error { color: #e74c3c; font-size: 0.85rem; min-height: 1.5em; margin-top: 8px; }
        .dashboard { display: none; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .dash-header h2 { color: #2c6b9e; }
        .logout-btn { background: transparent; border: 1px solid #e74c3c; color: #e74c3c; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
        .logout-btn:hover { background: #e74c3c; color: #fff; }
        .chat-header { padding: 10px 16px; background: #e8f0fe; border-bottom: 1px solid #d0ddea; }
        .chat-header h3 { color: #2c6b9e; font-size: 0.95rem; margin-bottom: 4px; }
        .chat-header p { font-size: 0.8rem; color: #888; margin-top: 4px; }
        .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.6; word-break: break-word; }
        .msg strong { font-weight: 600; }
        .msg em { font-style: italic; }
        .msg.user { align-self: flex-end; background: #2c6b9e; color: #fff; border-bottom-right-radius: 4px; }
        .msg.ia { align-self: flex-start; background: #f0f5fa; color: #333; border-bottom-left-radius: 4px; }
        .chat-input-area { display: flex; gap: 10px; padding: 15px 20px; border-top: 1px solid #d0ddea; background: #f8fafc; }
        .chat-input-area textarea { flex: 1; padding: 12px; border: 2px solid #d0ddea; border-radius: 12px; font-size: 0.95rem; outline: none; font-family: inherit; resize: none; height: 50px; }
        .chat-input-area textarea:focus { border-color: #2c6b9e; }
        .chat-input-area .send-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; font-size: 1.5rem; cursor: pointer; flex-shrink: 0; color: #2c6b9e; }
        .chat-empty { text-align: center; padding: 40px; color: #aaa; font-size: 0.9rem; }
        .loading-dots { align-self: flex-start; padding: 12px 16px; border-radius: 15px; background: #f0f5fa; color: #888; font-size: 1.2rem; border-bottom-left-radius: 4px; }

        body.dark-mode { background: #0d1b2a; color: #d4d4dc; }
        body.dark-mode .login-section { background: rgba(20,35,55,0.95); }
        body.dark-mode .login-section input { background: #1a2d45; border-color: #2a4565; color: #d4d4dc; }
        body.dark-mode .chat-box { flex: 1; background: rgba(20,35,55,0.95); }
        body.dark-mode .chat-header { background: #15273d; border-color: #2a4565; }
        body.dark-mode .chat-header h3 { color: #6ba4d6; }
        body.dark-mode .chat-body { background: #0d1b2a; }
        body.dark-mode .msg.ia { background: #1a2d45; color: #d4d4dc; }
        body.dark-mode .msg.user { background: #2c6b9e; }
        .tips-summary { background: #e8f4e8; border: 1px solid #4a8; border-radius: 12px; padding: 12px 16px; margin: 8px 0; font-size: 0.9rem; }
        .tips-summary ul { margin: 6px 0 0 0; padding-left: 20px; }
        .tips-summary li { margin: 4px 0; }
        .tips-summary small { color: #666; }
        body.dark-mode .tips-summary { background: #1a3a2a; border-color: #4a8; }
        body.dark-mode .tips-summary small { color: #aaa; }
        body.dark-mode #addTipBtn { border-color: #4a8 !important; color: #4a8 !important; }
        body.dark-mode #listTipsBtn { border-color: #4a8 !important; color: #4a8 !important; }
        body.dark-mode .chat-input-area { background: #15273d; border-color: #2a4565; }
        body.dark-mode .chat-input-area textarea { background: #1a2d45; border-color: #2a4565; color: #d4d4dc; }
        body.dark-mode .loading-dots { background: #1a2d45; color: #888; }
        body.dark-mode .dash-header h2 { color: #d4d4dc; }
        body.dark-mode .logout-btn { border-color: #ff6b6b; color: #ff6b6b; }
        body.dark-mode .logout-btn:hover { background: #ff6b6b; color: #fff; }
        body.dark-mode .login-section h1 { color: #6ba4d6; }
        body.dark-mode .login-error { color: #ff6b6b; }

        .main-layout { display: flex; gap: 16px; align-items: flex-start; }
        .chat-box { flex: 1; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; height: 70vh; min-height: 400px; }
        .tips-panel { width: 330px; height: 420px; background: rgba(255,255,255,0.95); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: none; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        .tips-panel.open { display: flex; }
        .tips-panel-header { padding: 10px 14px; background: #e8f0fe; border-bottom: 1px solid #d0ddea; display: flex; justify-content: space-between; align-items: center; }
        .tips-panel-header h3 { font-size: 0.9rem; color: #2c6b9e; }
        .tips-panel-header button { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: #888; padding: 0 4px; }
        .tips-panel-body { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 0.85rem; }
        .tips-panel-body .tip-item { padding: 6px 0; border-bottom: 1px solid #eee; }
        .tips-panel-body .tip-item:last-child { border-bottom: none; }
        .tips-panel-body .tip-day { color: #888; font-size: 0.75rem; margin-bottom: 2px; }
        .tips-panel-body .tip-text { line-height: 1.5; }
        body.dark-mode .tips-panel { background: rgba(20,35,55,0.95); }
        body.dark-mode .tips-panel-header { background: #15273d; border-color: #2a4565; }
        body.dark-mode .tips-panel-header h3 { color: #6ba4d6; }
        body.dark-mode .tips-panel-body .tip-item { border-color: #2a4565; }
        body.dark-mode .tips-panel-body .tip-day { color: #888; }
        body.dark-mode .tips-panel-header button { color: #aaa; }

        .topic-sug { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        .topic-sug button { background: #e8f0fe; border: 1px solid #d0ddea; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.7rem; color: #2c6b9e; }
        .topic-sug button:hover { background: #2c6b9e; color: #fff; border-color: #2c6b9e; }
        body.dark-mode .topic-sug button { background: #1a2d45; border-color: #2a4565; color: #6ba4d6; }
        body.dark-mode .topic-sug button:hover { background: #2c6b9e; color: #fff; border-color: #2c6b9e; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="loginSection" class="login-section">
        <h1>🇺🇸 English Teacher</h1>
        <p>Practice your American English conversation skills.</p>
        <input type="email" id="loginEmail" placeholder="Email" value="fernando@despiertatuvoz.com">
        <input type="password" id="loginPassword" placeholder="Contraseña">
        <div class="login-error" id="loginError"></div>
        <button id="loginBtn" class="main-btn" style="width:100%;margin-top:5px;background:#2c6b9e;">Entrar</button>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="dash-header">
            <h2>🇺🇸 English Teacher</h2>
            <div style="display:flex;gap:8px;">
                <button id="reviewBtn" style="background:#2c6b9e;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem;font-family:inherit;">📝 Daily Review</button>
                <button id="listTipsBtn" style="background:transparent;border:1px solid #4a8;color:#4a8;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem;font-family:inherit;">📋 Listado de tips</button>
                <button id="addTipBtn" style="background:transparent;border:1px solid #4a8;color:#4a8;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem;font-family:inherit;">✏️ +Tip</button>
                <button id="darkToggle" style="background:transparent;border:1px solid #2c6b9e;color:#2c6b9e;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:1rem;font-family:inherit;" title="Modo oscuro">🌙</button>
                <button id="clearChatBtn" style="background:transparent;border:1px solid #e74c3c;color:#e74c3c;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.85rem;font-family:inherit;">🗑 Borrar</button>
                <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="chat-box">
                <div class="chat-header">
                    <h3>🧑‍🏫 Your English Teacher — B1 Conversational</h3>
                    <div class="topic-sug">
                        <button data-t="Introduce yourself">Introduce yourself</button>
                        <button data-t="Talk about your weekend">Talk about your weekend</button>
                        <button data-t="Order food at a restaurant">Order food at a restaurant</button>
                        <button data-t="Describe your job">Describe your job</button>
                        <button data-t="Make a phone appointment">Make a phone appointment</button>
                    </div>
                </div>
                <div id="chatBody" class="chat-body">
                    <div class="chat-empty">💬 Write something in English to start...</div>
                </div>
                <div class="chat-input-area">
                    <textarea id="msgInput" placeholder="Write in English..." rows="1"></textarea>
                    <button id="sendBtn" class="send-btn">➤</button>
                </div>
            </div>

            <div id="tipsPanel" class="tips-panel">
                <div class="tips-panel-header">
                    <h3>📋 Tips acumulados</h3>
                    <button id="closeTipsPanel">&times;</button>
                </div>
                <div id="tipsPanelBody" class="tips-panel-body">
                    <p style="color:#888;text-align:center;padding:20px;">Haz clic en "Listado de tips" para verlos.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    let sb;
    let history = [];
    let esperando = false;
    let userId = null;
    let pendingIntent = 'teacher';

    const $ = id => document.getElementById(id);
    const chatBody = $('chatBody');

    async function init() {
        const configRes = await fetch('/api/config');
        const config = await configRes.json();
        sb = createClient(config.url, config.key, { auth: { persistSession: false } });

        const session = localStorage.getItem('sb-session');
        if (session) {
            await sb.auth.setSession(JSON.parse(session));
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                userId = user.id;
                $('loginSection').style.display = 'none';
                $('dashboard').style.display = 'block';
                return;
            }
        }
    }

    $('loginBtn').onclick = async () => {
        const email = $('loginEmail').value.trim();
        const password = $('loginPassword').value.trim();
        if (!email || !password) { $('loginError').textContent = 'Completa ambos campos'; return; }
        $('loginError').textContent = '';
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { $('loginError').textContent = error.message; return; }
        localStorage.setItem('sb-session', JSON.stringify(data.session));
        userId = data.user.id;
        $('loginSection').style.display = 'none';
        $('dashboard').style.display = 'block';
    };

    $('logoutBtn').onclick = async () => {
        await sb.auth.signOut();
        localStorage.removeItem('sb-session');
        history = [];
        userId = null;
        $('dashboard').style.display = 'none';
        $('loginSection').style.display = 'block';
        $('loginPassword').value = '';
    };

    function aplicarModoOscuro(oscuro) {
        document.body.classList.toggle('dark-mode', oscuro);
        $('darkToggle').textContent = oscuro ? '☀️' : '🌙';
        localStorage.setItem('dark-mode', oscuro ? '1' : '0');
    }
    $('darkToggle').onclick = () => aplicarModoOscuro(!document.body.classList.contains('dark-mode'));
    if (localStorage.getItem('dark-mode') === '1' || (localStorage.getItem('dark-mode') === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        aplicarModoOscuro(true);
    }

    $('clearChatBtn').onclick = () => { history = []; chatBody.innerHTML = '<div class="chat-empty">💬 Conversation cleared.</div>'; };

    let skipDisplay = false;

    $('reviewBtn').onclick = () => {
        if (pendingIntent === 'teacher_review') {
            pendingIntent = 'teacher';
            history = [];
            chatBody.innerHTML = '<div class="chat-empty">💬 Back to conversation mode.</div>';
            $('reviewBtn').style.background = '#2c6b9e';
            $('reviewBtn').textContent = '📝 Daily Review';
            return;
        }
        pendingIntent = 'teacher_review';
        history = [];
        chatBody.innerHTML = '<div class="chat-empty">📝 Starting daily review...</div>';
        $('reviewBtn').style.background = '#e67e22';
        $('reviewBtn').textContent = '🔄 Back to chat';
        skipDisplay = true;
        $('msgInput').value = 'Start the review';
        enviar();
    };

    $('addTipBtn').onclick = async () => {
        const tip = prompt('✏️ Escribe el tip (ej: "I go → I\'ll go"):');
        if (!tip || !tip.trim()) return;
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ intent: 'add_teacher_tip', userId, tip: tip.trim() })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.details || data.error);
            agregarMensaje(`✅ Tip guardado: ${tip}`, 'ia');
        } catch (e) {
            agregarMensaje('⚠️ Error al guardar tip: ' + e.message, 'ia');
        }
    };

    $('listTipsBtn').onclick = async () => {
        const panel = $('tipsPanel');
        const body = $('tipsPanelBody');
        panel.classList.add('open');
        body.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">Cargando...</p>';
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ intent: 'get_teacher_tips', userId })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.details || data.error);
            if (!data.tips || data.tips.length === 0) {
                body.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">📭 No hay tips guardados aún.</p>';
                return;
            }
            let html = '';
            data.tips.forEach(t => {
                html += `<div class="tip-item"><div class="tip-day">${t.day}</div><div class="tip-text">${t.content.replace(/\n/g, '<br>')}</div></div>`;
            });
            body.innerHTML = html;
        } catch (e) {
            body.innerHTML = `<p style="color:#e74c3c;text-align:center;padding:20px;">⚠️ Error: ${e.message}</p>`;
        }
    };

    $('closeTipsPanel').onclick = () => { $('tipsPanel').classList.remove('open'); };

    document.querySelectorAll('.topic-sug button').forEach(btn => {
        btn.onclick = () => { $('msgInput').value = btn.dataset.t; $('sendBtn').click(); };
    });

    function agregarMensaje(texto, rol) {
        if (rol === 'user' && skipDisplay) { skipDisplay = false; return; }
        const div = document.createElement('div');
        div.className = `msg ${rol}`;
        div.innerHTML = marked.parse(texto);
        const empty = chatBody.querySelector('.chat-empty');
        if (empty) empty.remove();
        chatBody.appendChild(div);
        if (rol === 'user') {
            chatBody.scrollTop = chatBody.scrollHeight;
        } else {
            div.scrollIntoView({ block: 'start' });
        }
    }

    function mostrarLoading() {
        const div = document.createElement('div');
        div.className = 'loading-dots';
        div.id = 'loadingDots';
        div.textContent = '✦ ✦ ✦';
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function quitarLoading() {
        const el = document.getElementById('loadingDots');
        if (el) el.remove();
    }

    async function enviar() {
        const texto = $('msgInput').value.trim();
        if (!texto || esperando || !userId) return;
        $('msgInput').value = '';
        esperando = true;

        agregarMensaje(texto, 'user');
        history.push({ role: 'user', parts: [{ text: texto }] });
        mostrarLoading();

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    intent: pendingIntent,
                    message: texto,
                    history: history.slice(-20),
                    userId
                })
            });
            const data = await res.json();
            quitarLoading();
            if (data.error) throw new Error(data.details || data.error);

            const respuesta = data.text || '';
            agregarMensaje(respuesta, 'ia');
            history.push({ role: 'model', parts: [{ text: respuesta }] });
        } catch (e) {
            quitarLoading();
            agregarMensaje('⚠️ Error: ' + e.message, 'ia');
        } finally {
            esperando = false;
        }
    }

    $('sendBtn').onclick = enviar;
    $('msgInput').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } };

    init();
</script>
</body>
</html>

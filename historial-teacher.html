<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Profesor - Despierta tu Voz</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background: #f5f2ed; color: #333; min-height: 100vh; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        .login-section {
            max-width: 380px; margin: 60px auto; padding: 30px;
            background: rgba(255,255,255,0.95); border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); text-align: center;
        }
        .login-section h1 { color: #8e7d6d; margin-bottom: 10px; font-size: 1.6rem; }
        .login-section input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 1rem; outline: none; font-family: inherit; margin-bottom: 10px; }
        .login-section input:focus { border-color: #8e7d6d; }
        .login-error { color: #e74c3c; font-size: 0.85rem; min-height: 1.5em; margin-top: 8px; }

        .dashboard { display: none; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .dash-header h2 { color: #8e7d6d; }
        .logout-btn { background: transparent; border: 1px solid #e74c3c; color: #e74c3c; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
        .logout-btn:hover { background: #e74c3c; color: #fff; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: 0.95rem; border: 2px solid #ddd; background: #fff; color: #666; transition: all 0.2s; }
        .tab:hover { border-color: #8e7d6d; color: #8e7d6d; }
        .tab.active { background: #8e7d6d; color: #fff; border-color: #8e7d6d; }

        .panel {
            background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 20px;
        }
        .panel h3 { color: #8e7d6d; margin-bottom: 15px; }

        .fila { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; align-items: flex-end; }
        .fila .campo { flex: 1; min-width: 150px; }
        .fila label { display: block; font-size: 0.8rem; font-weight: 600; color: #666; margin-bottom: 4px; }
        .fila input, .fila select { width: 100%; padding: 10px 12px; border: 2px solid #eee; border-radius: 10px; font-size: 0.93rem; outline: none; font-family: inherit; }
        .fila input:focus, .fila select:focus { border-color: #8e7d6d; }

        .main-btn {
            background: #8e7d6d; color: #fff; border: none; padding: 10px 22px;
            border-radius: 12px; font-size: 0.93rem; font-family: inherit; cursor: pointer; white-space: nowrap;
        }
        .main-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(142,125,109,0.3); }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .result-count { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
        .msg-card {
            padding: 14px 16px; border-radius: 12px; margin-bottom: 8px;
            border-left: 4px solid #8e7d6d; background: #faf8f4;
        }
        .msg-card .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.8rem; flex-wrap: wrap; gap: 6px; }
        .msg-card .msg-num { font-weight: 700; color: #8e7d6d; }
        .msg-card .fecha { color: #aaa; }
        .msg-card .emisor-tag { padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .msg-card .emisor-usuario { background: #e8f0fe; color: #1a73e8; }
        .msg-card .emisor-ia { background: #e6f7e6; color: #2e7d32; }
        .msg-card .emisor-tips { background: #fdf1dc; color: #b26a00; }
        .msg-card .texto { font-size: 0.93rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .msg-card .texto .highlight { background: #fff3cd; padding: 1px 3px; border-radius: 3px; }
        .msg-card .texto-truncado { max-height: 80px; overflow: hidden; position: relative; cursor: pointer; }
        .msg-card .texto-truncado::after { content: '... ver más'; position: absolute; bottom: 0; right: 0; background: #faf8f4; padding: 0 6px; font-size: 0.8rem; color: #8e7d6d; }
        .msg-card .texto-truncado.expandido { max-height: none; }
        .msg-card .texto-truncado.expandido::after { content: none; }

        .edit-area { display: none; margin-top: 8px; }
        .edit-area textarea {
            width: 100%; min-height: 200px; padding: 10px 12px; border: 2px solid #eee;
            border-radius: 10px; font-size: 0.93rem; line-height: 1.5; outline: none;
            font-family: inherit; resize: vertical; background: #fff; color: #333;
        }
        .edit-area textarea:focus { border-color: #8e7d6d; }
        .edit-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
        .edit-btn {
            background: transparent; border: 1px solid #8e7d6d; color: #8e7d6d;
            padding: 4px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.8rem;
        }
        .edit-btn:hover { background: #8e7d6d; color: #fff; }
        .save-btn { background: #8e7d6d; color: #fff; border: none; }
        .save-btn:hover { background: #7a6a5c; }
        .cancel-btn { border-color: #ccc; color: #888; }
        .cancel-btn:hover { background: #eee; color: #555; }
        .edit-status { font-size: 0.8rem; margin-top: 6px; text-align: right; }
        .edit-status.ok { color: #2e7d32; }
        .edit-status.err { color: #e74c3c; }

        .sin-resultados { text-align: center; padding: 40px 20px; color: #aaa; }

        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); display: none; align-items: center; justify-content: center; z-index: 100; }
        .spinner { width: 48px; height: 48px; border: 4px solid #ddd; border-top-color: #8e7d6d; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    /* ===== Dark Mode ===== */
    body.dark-mode { background: #12121e; color: #d4d4dc; }
    body.dark-mode .login-section { background: rgba(28,28,48,0.95); box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    body.dark-mode .login-section input { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
    body.dark-mode .panel { background: rgba(28,28,48,0.95); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    body.dark-mode .panel h3 { color: #a89b8a; }
    body.dark-mode .fila input,
    body.dark-mode .fila select { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
    body.dark-mode .fila label { color: #aaa; }
    body.dark-mode .tab { background: #1c1c30; border-color: #2e2e48; color: #999; }
    body.dark-mode .tab:hover { border-color: #a89b8a; color: #a89b8a; }
    body.dark-mode .tab.active { background: #8e7d6d; color: #fff; border-color: #8e7d6d; }
    body.dark-mode .main-btn:hover { box-shadow: 0 8px 25px rgba(142,125,109,0.15); }
    body.dark-mode .result-count { color: #999; }
    body.dark-mode .msg-card { background: #23233a; border-left-color: #a89b8a; }
    body.dark-mode .msg-card .fecha { color: #777; }
    body.dark-mode .msg-card .emisor-usuario { background: #1a2a4a; color: #6ba4ff; }
    body.dark-mode .msg-card .emisor-ia { background: #1a2e1a; color: #4caf50; }
    body.dark-mode .msg-card .emisor-tips { background: #2e2a1a; color: #e0a64c; }
    body.dark-mode .msg-card .texto .highlight { background: #5a4a30; }
    body.dark-mode .msg-card .texto-truncado::after { background: #23233a; color: #a89b8a; }
    body.dark-mode .edit-area textarea { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
    body.dark-mode .cancel-btn:hover { background: #2e2e48; color: #aaa; }
    body.dark-mode .sin-resultados { color: #666; }
    body.dark-mode .spinner { border-color: #2e2e48; border-top-color: #8e7d6d; }
    body.dark-mode .orden-btn { background: #26263d !important; border-color: #2e2e48 !important; color: #d4d4dc !important; }
    body.dark-mode .dash-header h2 { color: #d4d4dc; }
    body.dark-mode .loading-overlay { background: rgba(0,0,0,0.5); }
    body.dark-mode .login-section h1 { color: #a89b8a; }
    body.dark-mode .login-error { color: #ff6b6b; }
    @media (prefers-color-scheme: dark) {
        body:not(.light-mode) { background: #12121e; color: #d4d4dc; }
        body:not(.light-mode) .login-section { background: rgba(28,28,48,0.95); }
        body:not(.light-mode) .login-section input { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
        body:not(.light-mode) .panel { background: rgba(28,28,48,0.95); }
        body:not(.light-mode) .panel h3 { color: #a89b8a; }
        body:not(.light-mode) .fila input,
        body:not(.light-mode) .fila select { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
        body:not(.light-mode) .fila label { color: #aaa; }
        body:not(.light-mode) .tab { background: #1c1c30; border-color: #2e2e48; color: #999; }
        body:not(.light-mode) .tab:hover { border-color: #a89b8a; color: #a89b8a; }
        body:not(.light-mode) .tab.active { background: #8e7d6d; color: #fff; border-color: #8e7d6d; }
        body:not(.light-mode) .msg-card { background: #23233a; border-left-color: #a89b8a; }
        body:not(.light-mode) .msg-card .fecha { color: #777; }
        body:not(.light-mode) .msg-card .emisor-usuario { background: #1a2a4a; color: #6ba4ff; }
        body:not(.light-mode) .msg-card .emisor-ia { background: #1a2e1a; color: #4caf50; }
        body:not(.light-mode) .msg-card .emisor-tips { background: #2e2a1a; color: #e0a64c; }
        body:not(.light-mode) .msg-card .texto .highlight { background: #5a4a30; }
        body:not(.light-mode) .msg-card .texto-truncado::after { background: #23233a; color: #a89b8a; }
        body:not(.light-mode) .edit-area textarea { background: #26263d; border-color: #2e2e48; color: #d4d4dc; }
        body:not(.light-mode) .cancel-btn:hover { background: #2e2e48; color: #aaa; }
        body:not(.light-mode) .sin-resultados { color: #666; }
        body:not(.light-mode) .spinner { border-color: #2e2e48; border-top-color: #8e7d6d; }
        body:not(.light-mode) .loading-overlay { background: rgba(0,0,0,0.5); }
        body:not(.light-mode) .login-section h1 { color: #a89b8a; }
        body:not(.light-mode) .login-error { color: #ff6b6b; }
        body:not(.light-mode) .dash-header h2 { color: #d4d4dc; }
    }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="loginSection" class="login-section">
        <h1>Historial del Profesor</h1>
        <p>Consulta las conversaciones con tu profesor de inglés.</p>
        <input type="email" id="loginEmail" placeholder="Email" value="fernando@despiertatuvoz.com">
        <input type="password" id="loginPassword" placeholder="Contraseña">
        <div class="login-error" id="loginError"></div>
        <button id="loginBtn" class="main-btn" style="width:100%;margin-top:5px;">Entrar</button>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="dash-header">
            <h2>📜 Historial del Profesor</h2>
            <div style="display:flex;gap:8px;">
                <button id="darkToggle" style="background:transparent;border:1px solid #8e7d6d;color:#8e7d6d;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:1rem;font-family:inherit;" title="Modo oscuro">🌙</button>
                <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="teacher">Teacher</div>
            <div class="tab" data-tab="chat">Chat</div>
        </div>

        <!-- Pestaña: Teacher -->
        <div id="tabTeacher">
            <div class="panel">
                <h3>Filtros</h3>
                <div class="fila">
                    <div class="campo">
                        <label for="keyword">Palabra clave</label>
                        <input type="text" id="keyword" placeholder="Buscar en los mensajes...">
                    </div>
                    <div class="campo">
                        <label for="fechaDesde">Desde</label>
                        <input type="date" id="fechaDesde">
                    </div>
                    <div class="campo">
                        <label for="fechaHasta">Hasta</label>
                        <input type="date" id="fechaHasta">
                    </div>
                    <div class="campo" style="flex:0 0 auto;">
                        <label>Orden</label>
                        <button id="ordenBtn" class="orden-btn" style="display:flex;align-items:center;gap:6px;padding:10px 14px;border:2px solid #eee;border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;font-size:0.93rem;color:#666;width:100%;">↓ Más reciente</button>
                    </div>
                    <button id="buscarBtn" class="main-btn" style="align-self:flex-end;">Buscar</button>
                </div>
            </div>
            <div class="panel" id="resultados">
                <div class="result-bar" style="display:none;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px;">
                    <button id="informeBtn" class="main-btn" style="background:#27ae60;">📊 Informe mensual</button>
                    <button id="pdfBtn" class="main-btn" style="background:#c0392b;">📄 Descargar PDF</button>
                </div>
                <div class="sin-resultados">Introduce un texto o define un rango de fechas y haz clic en Buscar.</div>
            </div>
        </div>

        <!-- Pestaña: Chat -->
        <div id="tabChat" style="display:none;">
            <div class="panel">
                <h3>Filtros</h3>
                <div class="fila">
                    <div class="campo">
                        <label for="keywordChat">Palabra clave</label>
                        <input type="text" id="keywordChat" placeholder="Buscar en los mensajes...">
                    </div>
                    <div class="campo">
                        <label for="fechaDesdeChat">Desde</label>
                        <input type="date" id="fechaDesdeChat">
                    </div>
                    <div class="campo">
                        <label for="fechaHastaChat">Hasta</label>
                        <input type="date" id="fechaHastaChat">
                    </div>
                    <div class="campo" style="flex:0 0 auto;">
                        <label>Orden</label>
                        <button id="ordenChatBtn" class="orden-btn" style="display:flex;align-items:center;gap:6px;padding:10px 14px;border:2px solid #eee;border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;font-size:0.93rem;color:#666;width:100%;">↓ Más reciente</button>
                    </div>
                    <button id="buscarChatBtn" class="main-btn" style="align-self:flex-end;">Buscar</button>
                </div>
            </div>
            <div class="panel" id="resultadosChat">
                <div class="result-bar" style="display:none;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px;">
                    <button id="informeBtnChat" class="main-btn" style="background:#27ae60;">📊 Informe mensual</button>
                    <button id="pdfBtnChat" class="main-btn" style="background:#c0392b;">📄 Descargar PDF</button>
                </div>
                <div class="sin-resultados">Introduce un texto o define un rango de fechas y haz clic en Buscar.</div>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    let sb;
    let ascendente = false;
    let ascendenteChat = false;
    let resultadosActuales = [];
    let tabActual = 'teacher';

    const $ = id => document.getElementById(id);
    const setLoading = on => { $('loadingOverlay').style.display = on ? 'flex' : 'none'; };

    async function init() {
        const configRes = await fetch('/api/config');
        const config = await configRes.json();

        sb = createClient(config.url, config.key, { auth: { persistSession: false } });

        const session = localStorage.getItem('sb-session');
        if (session) {
            await sb.auth.setSession(JSON.parse(session));
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                $('loginSection').style.display = 'none';
                $('dashboard').style.display = 'block';
                initFechas();
                return;
            }
        }
    }

    $('loginBtn').onclick = async () => {
        const email = $('loginEmail').value.trim();
        const password = $('loginPassword').value.trim();
        if (!email || !password) { $('loginError').textContent = 'Completa ambos campos'; return; }
        $('loginError').textContent = '';
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { $('loginError').textContent = error.message; return; }
        localStorage.setItem('sb-session', JSON.stringify(data.session));
        $('loginSection').style.display = 'none';
        $('dashboard').style.display = 'block';
        initFechas();
    };

    $('logoutBtn').onclick = async () => {
        await sb.auth.signOut();
        localStorage.removeItem('sb-session');
        $('dashboard').style.display = 'none';
        $('loginSection').style.display = 'block';
        $('loginPassword').value = '';
    };

    function initFechas() {
        const hoy = new Date().toISOString().split('T')[0];
        const mesAntes = new Date(Date.now() - 30*24*60*60*1000).toISOString().split('T')[0];
        ['fechaDesde', 'fechaDesdeChat'].forEach(id => { if (!$('' + id).value) $('' + id).value = mesAntes; });
        ['fechaHasta', 'fechaHastaChat'].forEach(id => { if (!$('' + id).value) $('' + id).value = hoy; });
    }

    // ===== Tabs =====
    document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            $('tabTeacher').style.display = tab.dataset.tab === 'teacher' ? 'block' : 'none';
            $('tabChat').style.display = tab.dataset.tab === 'chat' ? 'block' : 'none';
        };
    });

    // ===== Toggle orden =====
    $('ordenBtn').onclick = () => {
        ascendente = !ascendente;
        $('ordenBtn').innerHTML = ascendente ? '↑ Más antiguo' : '↓ Más reciente';
    };

    $('ordenChatBtn').onclick = () => {
        ascendenteChat = !ascendenteChat;
        $('ordenChatBtn').innerHTML = ascendenteChat ? '↑ Más antiguo' : '↓ Más reciente';
    };

    // ===== Búsqueda =====
    $('buscarBtn').onclick = async () => {
        const keyword = $('keyword').value.trim();
        const desde = $('fechaDesde').value;
        const hasta = $('fechaHasta').value;

        if (!keyword && !desde && !hasta) { alert('Introduce un texto o especifica un rango de fechas.'); return; }

        setLoading(true);
        try {
            const { data: { user } } = await sb.auth.getUser();
            if (!user) { alert('Sesión no válida. Vuelve a iniciar sesión.'); return; }

            let query = sb.from('teacher')
                .select('id, role, content, created_at')
                .eq('user_id', user.id)
                .order('created_at', { ascending: ascendente })
                .limit(500);

            if (keyword) query = query.ilike('content', `%${keyword}%`);
            if (desde) query = query.gte('created_at', desde);
            if (hasta) query = query.lte('created_at', `${hasta}T23:59:59`);

            const { data, error } = await query;
            if (error) throw error;
            renderMensajes(data || [], keyword);
        } catch (e) {
            $('resultados').innerHTML = `<div class="sin-resultados" style="color:#e74c3c;">Error: ${e.message}</div>`;
        } finally {
            setLoading(false);
        }
    };

    // ===== Búsqueda Chat (tabla teacher_pure_chat) =====
    $('buscarChatBtn').onclick = async () => {
        const keyword = $('keywordChat').value.trim();
        const desde = $('fechaDesdeChat').value;
        const hasta = $('fechaHastaChat').value;

        if (!keyword && !desde && !hasta) { alert('Introduce un texto o especifica un rango de fechas.'); return; }

        setLoading(true);
        try {
            const { data: { user } } = await sb.auth.getUser();
            if (!user) { alert('Sesión no válida. Vuelve a iniciar sesión.'); return; }

            let query = sb.from('teacher_pure_chat')
                .select('id, role, content, created_at')
                .eq('user_id', user.id)
                .order('created_at', { ascending: ascendenteChat })
                .limit(500);

            if (keyword) query = query.ilike('content', `%${keyword}%`);
            if (desde) query = query.gte('created_at', desde);
            if (hasta) query = query.lte('created_at', `${hasta}T23:59:59`);

            const { data, error } = await query;
            if (error) throw error;
            renderMensajesChat(data || [], keyword);
        } catch (e) {
            $('resultadosChat').innerHTML = `<div class="sin-resultados" style="color:#e74c3c;">Error: ${e.message}</div>`;
        } finally {
            setLoading(false);
        }
    };

    function renderMensajes(msgs, keyword) {
        const cont = $('resultados');
        if (!msgs.length) {
            cont.innerHTML = '<div class="sin-resultados">No se encontraron mensajes.</div>';
            $('pdfBtn').closest('.result-bar').style.display = 'none';
            return;
        }
        resultadosActuales = msgs;
        tabActual = 'teacher';
        $('pdfBtn').closest('.result-bar').style.display = 'flex';
        cont.innerHTML = `<div class="result-count">${msgs.length} mensajes encontrados</div>`;
        cont.innerHTML += msgs.map((m, i) => msgCard(m, keyword, i + 1, true)).join('');
    }

    function renderMensajesChat(msgs, keyword) {
        const cont = $('resultadosChat');
        if (!msgs.length) {
            cont.innerHTML = '<div class="sin-resultados">No se encontraron mensajes.</div>';
            $('pdfBtnChat').closest('.result-bar').style.display = 'none';
            return;
        }
        resultadosActuales = msgs;
        tabActual = 'chat';
        $('pdfBtnChat').closest('.result-bar').style.display = 'flex';
        cont.innerHTML = `<div class="result-count">${msgs.length} mensajes encontrados</div>`;
        cont.innerHTML += msgs.map((m, i) => msgCard(m, keyword, i + 1, false)).join('');
    }

    function renderMd(texto, keyword) {
        let t = texto.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
        t = t
            .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
            .replace(/^### (.+)$/gm, '<h3>$1</h3>')
            .replace(/^## (.+)$/gm, '<h2>$1</h2>')
            .replace(/^# (.+)$/gm, '<h1>$1</h1>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/__(.+?)__/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/_(.+?)_/g, '<em>$1</em>')
            .replace(/`(.+?)`/g, '<code>$1</code>')
            .replace(/\n/g, '<br>');
        if (keyword) {
            const re = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            t = t.replace(re, '<span class="highlight">$1</span>');
        }
        return t;
    }

    function msgCard(m, keyword, idx, editable) {
        let emisorCls, emisorLabel;
        if (m.role === 'user') {
            emisorCls = 'emisor-usuario';
            emisorLabel = '👤 Alumno';
        } else if (m.role === 'assistant') {
            emisorCls = 'emisor-ia';
            emisorLabel = '🤖 Profesor IA';
        } else {
            emisorCls = 'emisor-tips';
            emisorLabel = '📌 Tips diarios';
        }
        const fecha = new Date(m.created_at).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        const texto = renderMd(m.content || '', keyword);
        const editBtn = editable ? `<button class="edit-btn" data-action="editar">✏️ Editar</button>` : '';
        const editArea = editable ? `<div class="edit-area">
                <textarea data-role="textarea">${escapeHtml(m.content || '')}</textarea>
                <div class="edit-actions">
                    <button class="edit-btn save-btn" data-action="guardar">💾 Guardar</button>
                    <button class="edit-btn cancel-btn" data-action="cancelar">Cancelar</button>
                </div>
                <div class="edit-status"></div>
            </div>` : '';
        return `<div class="msg-card" data-id="${m.id}">
            <div class="meta">
                <span class="msg-num">#${idx}</span>
                <span class="emisor-tag ${emisorCls}">${emisorLabel}</span>
                <span class="fecha">${fecha}</span>
                ${editBtn}
            </div>
            <div class="texto texto-truncado" data-action="expandir">${texto}</div>
            ${editArea}
        </div>`;
    }

    function escapeHtml(texto) {
        return texto.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function editarMensaje(btn) {
        const card = btn.closest('.msg-card');
        const texto = card.querySelector('.texto');
        texto.style.display = 'none';
        card.querySelector('.edit-area').style.display = 'block';
        btn.style.display = 'none';
        card.querySelector('[data-role="textarea"]').focus();
    }

    function cancelarEdicion(btn) {
        const card = btn.closest('.msg-card');
        card.querySelector('.edit-area').style.display = 'none';
        card.querySelector('.texto').style.display = '';
        card.querySelector('.edit-btn').style.display = '';
    }

    async function guardarMensaje(btn) {
        const card = btn.closest('.msg-card');
        const status = card.querySelector('.edit-status');
        const textarea = card.querySelector('[data-role="textarea"]');
        const nuevo = textarea.value;
        status.textContent = '';
        status.className = 'edit-status';

        const { data: { user } } = await sb.auth.getUser();
        if (!user) { status.textContent = 'Sesión no válida.'; status.classList.add('err'); return; }

        btn.disabled = true;
        try {
            const res = await fetch('/api/chat', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: user.id, messageId: card.dataset.id, content: nuevo })
            });
            const json = await res.json();
            if (!res.ok || !json.success) throw new Error(json.error || 'Error al guardar');

            // Actualizar la vista
            card.querySelector('.texto').innerHTML = renderMd(nuevo, '');
            status.textContent = '✓ Guardado';
            status.classList.add('ok');
            cancelarEdicion(btn);
        } catch (e) {
            status.textContent = 'Error: ' + e.message;
            status.classList.add('err');
        } finally {
            btn.disabled = false;
        }
    }

    // ===== Dark Mode =====
    function aplicarModoOscuro(oscuro) {
        document.body.classList.toggle('dark-mode', oscuro);
        $('darkToggle').textContent = oscuro ? '☀️' : '🌙';
        localStorage.setItem('dark-mode', oscuro ? '1' : '0');
    }
    $('darkToggle').onclick = () => aplicarModoOscuro(!document.body.classList.contains('dark-mode'));
    if (localStorage.getItem('dark-mode') === '1' || (localStorage.getItem('dark-mode') === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        aplicarModoOscuro(true);
    }

    // Enter en el campo clave
    $('keyword').onkeydown = e => { if (e.key === 'Enter') $('buscarBtn').click(); };
    $('keywordChat').onkeydown = e => { if (e.key === 'Enter') $('buscarChatBtn').click(); };

    // ===== PDF =====
    function textoPlano(md) {
        return (md || '')
            .replace(/^#{1,6}\s*/gm, '')
            .replace(/[>*`#_\-]/g, '')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
    }

    function generarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const pageWidth = doc.internal.pageSize.getWidth();
        const margin = 15;
        const usable = pageWidth - margin * 2;

        doc.setFontSize(16);
        doc.setFont('helvetica', 'bold');
        doc.text('Historial de conversación', margin, 18);
        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(120);
        doc.text(`Pestaña: ${tabActual === 'teacher' ? 'Teacher' : 'Chat'}`, margin, 24);
        doc.text(`Generado: ${new Date().toLocaleString('es-ES')}`, margin, 28);

        let y = 36;
        resultadosActuales.forEach((m, i) => {
            const emisor = m.role === 'user' ? 'Alumno' : (m.role === 'assistant' ? 'Profesor IA' : 'Tips');
            const fecha = new Date(m.created_at).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

            if (y > 270) { doc.addPage(); y = 18; }

            doc.setFontSize(9);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(30);
            doc.text(`#${i + 1}  ${emisor}  —  ${fecha}`, margin, y);
            y += 5;

            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            const lines = doc.splitTextToSize(textoPlano(m.content), usable);
            const lineHeight = 4.5;
            const spaceNeeded = lines.length * lineHeight + 6;
            if (y + spaceNeeded > 282) { doc.addPage(); y = 18; }

            doc.text(lines, margin, y);
            y += lines.length * lineHeight + 6;
            doc.setDrawColor(200);
            doc.line(margin, y - 3, pageWidth - margin, y - 3);
        });

        const resumen = resultadosActuales.length + ' mensajes exportados';
        doc.setFontSize(9);
        doc.setTextColor(120);
        doc.text(resumen, margin, 290);
        doc.save(`historial-${tabActual}-${new Date().toISOString().split('T')[0]}.pdf`);
    }

    function generarInforme() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const pageWidth = doc.internal.pageSize.getWidth();
        const margin = 15;
        const usable = pageWidth - margin * 2;

        const msgs = resultadosActuales;
        const delAlumno = msgs.filter(m => m.role === 'user');
        const delProfesor = msgs.filter(m => m.role === 'assistant');
        const palabras = delAlumno.reduce((n, m) => n + (m.content || '').split(/\s+/).filter(Boolean).length, 0);
        const fechas = msgs.map(m => new Date(m.created_at)).filter(f => !isNaN(f));
        const primera = fechas.length ? new Date(Math.min(...fechas.map(f => f.getTime()))).toLocaleDateString('es-ES') : '—';
        const ultima = fechas.length ? new Date(Math.max(...fechas.map(f => f.getTime()))).toLocaleDateString('es-ES') : '—';

        const correcciones = [];
        delProfesor.forEach(m => {
            const lines = (m.content || '').split('\n');
            lines.forEach(line => {
                if (line.includes('→')) {
                    const idx = line.indexOf('→');
                    const original = line.slice(0, idx).replace(/[*#`]/g, '').replace(/^.*?\sTip:/i, '').trim();
                    const correct = line.slice(idx + 1).replace(/[*#`]/g, '').trim();
                    if (original && correct) correcciones.push(`${original} → ${correct}`);
                } else if (/Instead of\s+.+?,\s+say/i.test(line)) {
                    const m2 = line.match(/Instead of\s+(.+?),\s+say[:\s]+(.+)/i);
                    if (m2) correcciones.push(`${m2[1].replace(/[*#`]/g, '').trim()} → ${m2[2].replace(/[*#`]/g, '').trim()}`);
                }
            });
        });

        const keyword = tabActual === 'teacher' ? $('keyword').value.trim() : $('keywordChat').value.trim();
        const desde = tabActual === 'teacher' ? $('fechaDesde').value : $('fechaDesdeChat').value;
        const hasta = tabActual === 'teacher' ? $('fechaHasta').value : $('fechaHastaChat').value;

        // Cabecera
        doc.setFontSize(18);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(39, 174, 96);
        doc.text('Informe de progreso', margin, 20);
        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(100);
        doc.text(`Alumno — Historial ${tabActual === 'teacher' ? 'Teacher' : 'Chat'}`, margin, 26);
        doc.text(`Período: ${desde || 'desde inicio'}  →  ${hasta || 'hoy'}`, margin, 30);
        doc.text(`Generado: ${new Date().toLocaleString('es-ES')}`, margin, 34);

        // Resumen
        let y = 44;
        const labelX = margin;
        const valX = margin + 75;
        const filas = [
            ['Mensajes totales', String(msgs.length)],
            ['Mensajes del alumno', String(delAlumno.length)],
            ['Mensajes del profesor', String(delProfesor.length)],
            ['Palabras escritas (alumno)', palabras.toLocaleString('es-ES')],
            ['Primera conversación', primera],
            ['Última conversación', ultima]
        ];
        if (keyword) filas.push(['Palabra buscada', keyword]);

        doc.setFontSize(12);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(30);
        doc.text('Resumen', margin, y);
        y += 6;
        filas.forEach(([k, v]) => {
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(80);
            doc.text(k + ':', labelX, y);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(30);
            doc.text(String(v), valX, y);
            y += 6;
        });

        // Correcciones
        y += 4;
        doc.setFontSize(12);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(30);
        doc.text('Correcciones del profesor', margin, y);
        y += 6;
        if (!correcciones.length) {
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(120);
            doc.text('No se encontraron correcciones en este período.', margin, y);
        } else {
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(50);
            correcciones.forEach(c => {
                const lines = doc.splitTextToSize('• ' + c, usable);
                if (y > 282) { doc.addPage(); y = 18; }
                doc.text(lines, margin, y);
                y += lines.length * 4.6 + 1;
            });
        }

        doc.setFontSize(9);
        doc.setTextColor(120);
        doc.text(msgs.length + ' mensajes analizados', margin, 290);
        doc.save(`informe-${tabActual}-${new Date().toISOString().split('T')[0]}.pdf`);
    }

    $('pdfBtn').onclick = () => { if (!resultadosActuales.length) { alert('Primero realiza una búsqueda.'); return; } try { generarPDF(); } catch (e) { alert('Error al generar el PDF: ' + e.message); } };
    $('pdfBtnChat').onclick = $('pdfBtn').onclick;
    const descargarInforme = () => { if (!resultadosActuales.length) { alert('Primero realiza una búsqueda.'); return; } try { generarInforme(); } catch (e) { alert('Error al generar el informe: ' + e.message); } };
    $('informeBtn').onclick = descargarInforme;
    $('informeBtnChat').onclick = descargarInforme;

    // ===== Event delegation (las funciones de módulo no son globales para onclick inline) =====
    ['resultados', 'resultadosChat'].forEach(id => {
        $('' + id).addEventListener('click', e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.dataset.action;
            if (action === 'editar') editarMensaje(btn);
            else if (action === 'guardar') guardarMensaje(btn);
            else if (action === 'cancelar') cancelarEdicion(btn);
            else if (action === 'expandir') btn.classList.toggle('expandido');
        });
    });

    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<script>if (localStorage.getItem('rolesDarkMode') === 'true') document.documentElement.setAttribute('data-theme', 'dark')</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles Dashboard - Despierta tu Voz</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-acento: #8e7d6d;
            --color-texto: #333;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --dark-bg: #1a1a1a;
            --dark-card: #2a2a2a;
            --dark-panel: #333;
            --dark-text: #e0d8cc;
            --dark-input: #3a3a3a;
            --dark-border: #444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background: #f5f2ed; color: var(--color-texto); min-height: 100vh; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        .login-section {
            max-width: 380px;
            margin: 60px auto;
            padding: 30px;
            background: var(--glass-bg);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-section h1 { color: var(--color-acento); margin-bottom: 10px; font-size: 1.6rem; }
        .login-section p { color: #888; margin-bottom: 25px; font-size: 0.9rem; }
        .login-section input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 1rem; outline: none; font-family: inherit; margin-bottom: 10px; }
        .login-section input:focus { border-color: var(--color-acento); box-shadow: 0 0 0 4px rgba(142,125,109,0.1); }
        .login-error { color: #e74c3c; font-size: 0.85rem; min-height: 1.5em; margin-top: 8px; }

        .dashboard { display: none; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .dash-header h2 { color: var(--color-acento); }
        .logout-btn { background: transparent; border: 1px solid #e74c3c; color: #e74c3c; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
        .logout-btn:hover { background: #e74c3c; color: #fff; }

        .selector-row { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; }
        .selector-row .input-group { flex: 1; }
        .selector-row label { font-size: 0.85rem; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
        .selector-row input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 0.95rem; outline: none; font-family: inherit; }
        .selector-row input:focus { border-color: var(--color-acento); }
        .sel-status { font-size: 0.75rem; color: #888; margin-top: 5px; min-height: 1.2em; }

        .btn { padding: 12px 24px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.95rem; font-family: inherit; transition: transform 0.2s, opacity 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-primary { background: var(--color-acento); color: #fff; box-shadow: 0 4px 15px rgba(142,125,109,0.3); }
        .btn-secondary { background: #6c757d; color: #fff; box-shadow: 0 4px 15px rgba(108,117,125,0.3); }

        .chat-box {
            background: #fff;
            border-radius: 18px;
            border: 1px solid #eee;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            margin-top: 20px;
        }
        @media (min-width: 1024px) {
            .chat-box { width: 60%; margin-left: auto; margin-right: auto; }
        }
        .chat-header {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            color: var(--color-acento);
        }
        .chat-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        @media (min-width: 1024px) {
            .chat-body { height: 480px; }
        }
        .chat-empty {
            text-align: center;
            color: #aaa;
            padding: 40px 20px;
            font-style: italic;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 0.92rem;
        }
        .msg .msg-label {
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 4px;
            opacity: 0.8;
        }
        .msg.yo {
            align-self: flex-end;
            background: var(--color-acento);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.yo .msg-label { color: rgba(255,255,255,0.8); }
        .msg.alumno {
            align-self: flex-start;
            background: #e8f0fe;
            border-bottom-left-radius: 4px;
            color: #333;
        }
        .msg.alumno .msg-label { color: #1a73e8; }

        .chat-input-area {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .chat-input-area textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
        }
        .chat-input-area textarea:focus { border-color: var(--color-acento); }
        .chat-input-area .send-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-acento);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .chat-input-area .send-btn svg { fill: #fff; width: 20px; height: 20px; }
        .chat-input-area .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .loading { display: none; text-align: center; padding: 10px; color: #888; font-size: 0.85rem; }

        /* DARK MODE */
        html[data-theme="dark"] body { background: var(--dark-bg); color: var(--dark-text); }
        html[data-theme="dark"] .login-section { background: var(--dark-card); }
        html[data-theme="dark"] .login-section input { background: var(--dark-input); border-color: var(--dark-border); color: var(--dark-text); }
        html[data-theme="dark"] .selector-row input { background: var(--dark-input); border-color: var(--dark-border); color: var(--dark-text); }
        html[data-theme="dark"] .chat-box { background: var(--dark-card); border-color: var(--dark-border); }
        html[data-theme="dark"] .chat-header { background: var(--dark-panel); border-color: var(--dark-border); }
        html[data-theme="dark"] .msg.alumno { background: #1a3a5c; color: var(--dark-text); }
        html[data-theme="dark"] .msg.alumno .msg-label { color: #64b5f6; }
        html[data-theme="dark"] .chat-input-area { border-top-color: var(--dark-border); }
        html[data-theme="dark"] .chat-input-area textarea { background: var(--dark-input); border-color: var(--dark-border); color: var(--dark-text); }
        html[data-theme="dark"] .btn-primary { box-shadow: 0 4px 15px rgba(212,175,55,0.2); }
    </style>
</head>

<body>
    <div class="container">
        <div id="loginSection" class="login-section">
            <h1>🎭 Roleplay con Alumno</h1>
            <p>Inicia sesión para conversar con un alumno interpretado por IA</p>
            <input type="email" id="loginEmail" placeholder="Email de mentor">
            <input type="password" id="loginPassword" placeholder="Contraseña">
            <button id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:10px;">Entrar</button>
            <p id="loginError" class="login-error"></p>
        </div>

        <div id="dashboard" class="dashboard">
            <div class="dash-header">
                <h2>🎭 Roleplay con Alumno</h2>
                <div>
                    <button id="toggleDarkBtn" class="btn" style="background:transparent;border:1px solid #888;color:#888;padding:6px 12px;font-size:0.8rem;margin-right:8px;">🌙</button>
                    <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
                </div>
            </div>

            <div class="selector-row">
                <div class="input-group">
                    <label for="studentInput">Alumno</label>
                    <input type="text" id="studentInput" list="studentList" placeholder="Escribe nombre o email...">
                    <datalist id="studentList"></datalist>
                    <p id="studentStatus" class="sel-status"></p>
                </div>
                <button id="selectBtn" class="btn btn-secondary" style="padding:12px 20px;white-space:nowrap;">Seleccionar</button>
            </div>

            <div class="chat-box">
                <div class="chat-header" id="chatHeader">Selecciona un alumno para empezar</div>
                <div id="chatBody" class="chat-body">
                    <div class="chat-empty">Selecciona un alumno para conversar con él.</div>
                </div>
                <div id="loading" class="loading">🤖 El alumno está escribiendo...</div>
                <div class="chat-input-area">
                    <textarea id="msgInput" placeholder="Escribe tu mensaje..." rows="1" disabled></textarea>
                    <button id="sendBtn" class="send-btn" disabled>
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        let sb;
        let studentId = null, studentName = null;
        let chatHistory = [];

        const EL = (id) => document.getElementById(id);

        async function init() {
            const configRes = await fetch('/api/config');
            const config = await configRes.json();
            sb = createClient(config.url, config.key, {
                auth: { storageKey: 'sb-roleplay-auth-token', autoRefreshToken: true, persistSession: true }
            });

            const { data: { session } } = await sb.auth.getSession();
            if (session) mostrarDashboard();

            EL('loginBtn').onclick = login;
            EL('loginPassword').onkeypress = (e) => { if (e.key === 'Enter') login(); };
            EL('logoutBtn').onclick = logout;
            EL('toggleDarkBtn').onclick = toggleDark;
            EL('selectBtn').onclick = seleccionar;
            EL('studentInput').onkeypress = (e) => { if (e.key === 'Enter') seleccionar(); };
            EL('sendBtn').onclick = enviarMensaje;
            EL('msgInput').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensaje(); } };
            EL('msgInput').oninput = function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; };

            if (localStorage.getItem('rolesDarkMode') === 'true') {
                document.documentElement.setAttribute('data-theme', 'dark');
                EL('toggleDarkBtn').textContent = '☀️';
            }
        }

        async function login() {
            const email = EL('loginEmail').value.trim();
            const password = EL('loginPassword').value.trim();
            if (!email || !password) { EL('loginError').textContent = 'Introduce email y contraseña.'; return; }

            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) { EL('loginError').textContent = error.message; return; }

            const { data: { session } } = await sb.auth.getSession();
            if (session) mostrarDashboard();
        }

        function mostrarDashboard() {
            EL('loginSection').style.display = 'none';
            EL('dashboard').style.display = 'block';
            EL('loginError').textContent = '';
            cargarListaAlumnos();
        }

        async function logout() {
            await sb.auth.signOut();
            EL('dashboard').style.display = 'none';
            EL('loginSection').style.display = 'block';
            studentId = null; studentName = null;
            chatHistory = [];
            EL('chatBody').innerHTML = '<div class="chat-empty">Selecciona un alumno para conversar con él.</div>';
            EL('msgInput').disabled = true;
            EL('sendBtn').disabled = true;
            EL('chatHeader').textContent = 'Selecciona un alumno para empezar';
        }

        function toggleDark() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? '' : 'dark');
            localStorage.setItem('rolesDarkMode', !isDark);
            EL('toggleDarkBtn').textContent = isDark ? '🌙' : '☀️';
        }

        async function cargarListaAlumnos() {
            const { data, error } = await sb
                .from('user_profiles')
                .select('email, nombre')
                .not('email', 'is', null)
                .order('nombre', { ascending: true });
            if (error) { console.error(error); return; }

            const list = EL('studentList');
            list.innerHTML = '';
            data.forEach(a => {
                const opt = document.createElement('option');
                opt.value = a.email;
                opt.textContent = a.nombre ? `${a.nombre} (${a.email})` : a.email;
                list.appendChild(opt);
            });
        }

        async function seleccionar() {
            const email = EL('studentInput').value.trim();
            if (!email) return;

            const { data, error } = await sb
                .from('user_profiles')
                .select('user_id, nombre')
                .eq('email', email.toLowerCase())
                .maybeSingle();

            if (error || !data) {
                EL('studentStatus').textContent = '❌ Alumno no encontrado.';
                return;
            }

            studentId = data.user_id;
            studentName = data.nombre || email;
            EL('studentStatus').textContent = `✅ ${studentName}`;
            EL('chatHeader').textContent = `Conversando con ${studentName}`;
            EL('msgInput').disabled = false;
            EL('sendBtn').disabled = false;
            EL('msgInput').focus();
            chatHistory = [];
            EL('chatBody').innerHTML = `<div class="chat-empty">Empieza a escribir para conversar con ${studentName}.</div>`;
        }

        function addMsg(cls, label, text) {
            const body = EL('chatBody');
            const empty = body.querySelector('.chat-empty');
            if (empty) empty.remove();
            const div = document.createElement('div');
            div.className = `msg ${cls}`;
            div.innerHTML = `<div class="msg-label">${label}</div><div>${text.replace(/\n/g, '<br>')}</div>`;
            body.appendChild(div);
        }

        function setLoading(on) {
            EL('loading').style.display = on ? 'block' : 'none';
            EL('sendBtn').disabled = on;
            EL('msgInput').disabled = on;
        }

        async function enviarMensaje() {
            const text = EL('msgInput').value.trim();
            if (!text || !studentId) return;

            EL('msgInput').value = '';
            EL('msgInput').style.height = 'auto';
            addMsg('yo', 'Yo', text);
            setLoading(true);

            try {
                const body = {
                    intent: 'roleplay_chat',
                    message: text,
                    history: chatHistory,
                    userId: studentId
                };
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                const now = new Date().toISOString();
                chatHistory.push({ role: 'user', parts: [{ text }], created_at: now });

                const parsed = parseRespuesta(data.text);
                addMsg('alumno', studentName, parsed);
                chatHistory.push({ role: 'model', parts: [{ text: parsed }], created_at: now });

            } catch (e) {
                addMsg('alumno', 'Error', `❌ ${e.message}`);
            } finally {
                setLoading(false);
                EL('msgInput').focus();
            }
        }

        function parseRespuesta(text) {
            return text.replace(/^(A|B|Alumno A|Alumno B|alumno a|alumno b):\s*/i, '').trim();
        }

        init();
    </script>
</body>
</html>

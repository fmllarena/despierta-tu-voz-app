<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña — Despierta tu Voz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #f5f2ed;
            color: #333;
            margin: 0;
            padding: 24px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            color: #8e7d6d;
            margin-bottom: 12px;
            font-size: 1.7rem;
            font-weight: 400;
        }
        p.intro {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2d9cd;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #8e7d6d;
        }
        button.btn-change {
            background: #8e7d6d;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button.btn-change:hover {
            background: #7a6a5c;
        }
        button.btn-change:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-msg {
            color: #c0392b;
            font-size: 0.85rem;
            margin-bottom: 12px;
            min-height: 1.2em;
            text-align: left;
        }
        .success-msg {
            color: #2ecc71;
            font-size: 0.9rem;
            margin-bottom: 12px;
            text-align: left;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #8e7d6d;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        html[data-theme="dark"] body { background: #1f1a16; color: #e8e0d6; }
        html[data-theme="dark"] .card { background: #2a2420; }
        html[data-theme="dark"] h1 { color: #d4af37; }
        html[data-theme="dark"] p.intro { color: #bbb; }
        html[data-theme="dark"] label { color: #bbb; }
        html[data-theme="dark"] input {
            background: #1a1511; border-color: #443a32; color: #e8e0d6;
        }
        html[data-theme="dark"] input:focus { border-color: #d4af37; }
        html[data-theme="dark"] .back-link { color: #d4af37; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Restablecer contraseña</h1>
        <p class="intro">Escribe tu nueva contraseña para acceder de nuevo a Despierta tu Voz.</p>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <div class="form-group" id="formContainer" style="display:none;">
            <label for="newPassword">Nueva contraseña</label>
            <input type="password" id="newPassword" placeholder="••••••••">
            <div class="form-group" style="margin-top:12px;">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" placeholder="••••••••">
            </div>
        </div>

        <button type="button" id="btnChange" class="btn-change" disabled>Cambiar contraseña</button>
        <a href="index-original.html" class="back-link">← Volver al login</a>

        <div id="loading" style="margin-top:20px; display:none;">
            <div class="spinner"></div> Procesando...
        </div>
    </div>

    <script>
        (function() {
            let supabaseClient = null;
            let tokenHash = null;
            let type = null;

            const $ = id => document.getElementById(id);
            const newPasswordInput = $('newPassword');
            const confirmPasswordInput = $('confirmPassword');
            const btnChange = $('btnChange');
            const errorMsg = $('errorMsg');
            const successMsg = $('successMsg');
            const formContainer = $('formContainer');
            const loading = $('loading');

            async function initSupabase() {
                try {
                    const configRes = await fetch('/api/config');
                    const config = await configRes.json();
                    supabaseClient = supabase.createClient(config.url, config.key);
                } catch (e) {
                    console.error('Error inicializando Supabase:', e);
                    errorMsg.textContent = 'Error de configuración. Recarga la página.';
                }
            }

            function getUrlParams() {
                const params = new URLSearchParams(window.location.search);
                return {
                    token_hash: params.get('token_hash') || params.get('access_token'),
                    type: params.get('type')
                };
            }

            async function init() {
                await initSupabase();

                const { token_hash, type: t } = getUrlParams();
                tokenHash = token_hash;
                type = t;

                if (!tokenHash) {
                    errorMsg.textContent = 'No se ha proporcionado un token de recuperación. Si solicitaste un cambio de contraseña, revisa tu email y haz clic en el enlace.';
                    return;
                }

                if (type !== 'recovery') {
                    errorMsg.textContent = 'Tipo de token no válido para recuperación de contraseña.';
                    return;
                }

                // Verificar que el token es válido antes de mostrar el formulario
                loading.style.display = 'block';
                btnChange.disabled = true;

                try {
                    const { data, error } = await supabaseClient.auth.verifyOtp({
                        token_hash: tokenHash,
                        type: 'recovery'
                    });

                    if (error) {
                        errorMsg.textContent = 'El enlace de recuperación no es válido o ha expirado. Solicita uno nuevo desde el login.';
                        loading.style.display = 'none';
                        return;
                    }

                    // Token válido: mostrar formulario
                    formContainer.style.display = 'block';
                    btnChange.disabled = false;
                    loading.style.display = 'none';
                } catch (e) {
                    console.error('Error verificando token:', e);
                    errorMsg.textContent = 'Error al verificar el enlace de recuperación.';
                    loading.style.display = 'none';
                }
            }

            btnChange.onclick = async () => {
                const newPassword = newPasswordInput.value.trim();
                const confirmPassword = confirmPasswordInput.value.trim();

                if (!newPassword) {
                    errorMsg.textContent = 'Introduce una nueva contraseña.';
                    return;
                }
                if (newPassword !== confirmPassword) {
                    errorMsg.textContent = 'Las contraseñas no coinciden.';
                    return;
                }
                if (newPassword.length < 6) {
                    errorMsg.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                    return;
                }

                errorMsg.textContent = '';
                successMsg.textContent = '';
                btnChange.disabled = true;
                loading.style.display = 'block';

                try {
                    const { error } = await supabaseClient.auth.updateUser({
                        password: newPassword
                    });

                    if (error) throw error;

                    successMsg.textContent = '✅ Contraseña actualizada con éxito. Ya puedes iniciar sesión con tu nueva contraseña.';
                    btnChange.disabled = true;
                    loading.style.display = 'none';
                    newPasswordInput.disabled = true;
                    confirmPasswordInput.disabled = true;

                    // Redirigir al login tras 2 segundos
                    setTimeout(() => {
                        window.location.href = 'index-original.html';
                    }, 2000);
                } catch (e) {
                    console.error('Error actualizando contraseña:', e);
                    errorMsg.textContent = 'No se pudo actualizar la contraseña. Inténtalo de nuevo.';
                    btnChange.disabled = false;
                    loading.style.display = 'none';
                }
            };

            // Enter en los campos para cambiar contraseña
            [newPasswordInput, confirmPasswordInput].forEach(input => {
                input.onkeypress = (e) => {
                    if (e.key === 'Enter') btnChange.click();
                };
            });

            init();
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión · Despierta tu Voz</title>
    <meta name="theme-color" content="#8e7d6d">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <style>
        :root {
            --acento: #8e7d6d;
            --fondo: #fcfaf7;
            --texto: #3a322a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--fondo);
            color: var(--texto);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
            text-align: center;
        }

        .card {
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .icono {
            font-size: 2.6rem;
            line-height: 1;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 10px;
            color: var(--acento);
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #6b5a47;
            margin: 0 0 22px;
        }

        button {
            background: var(--acento);
            color: #fff;
            border: 0;
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
            min-width: 160px;
        }

        button:hover { background: #7b6b5c; }

        .nota {
            margin-top: 18px;
            font-size: 0.8rem;
            color: #9c8d7c;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="icono" aria-hidden="true">🎙️</div>
        <h1>Sin conexión</h1>
        <p>
            No hemos podido conectar con el servidor. Tu historial sigue guardado:
            en cuanto recuperes la conexión podrás continuar donde lo dejaste.
        </p>
        <button type="button" onclick="location.reload()">Reintentar</button>
        <p class="nota">Despierta tu Voz · El viaje hacia tu propia voz</p>
    </main>
</body>

</html>
